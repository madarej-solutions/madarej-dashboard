<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة تدريب مدارج</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --navy: #0B2545;
    --navy-light: #16407a;
    --navy-lighter: #1e5399;
    --gold: #B8860A;
    --gold-light: #e0c15a;
    --bg: #f4f6f9;
    --card: #ffffff;
    --border: #e2e6ec;
    --text: #1a1f2b;
    --muted: #6b7385;
    --danger: #c0392b;
    --danger-bg: #fdecea;
    --success: #1e7e34;
    --success-bg: #eaf6ec;
    --warn: #8a6d00;
    --warn-bg: #fff8e1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Tahoma', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  #app { min-height: 100vh; display: flex; flex-direction: column; }

  /* ===== شاشة الدخول ===== */
  .login-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card {
    background: var(--card); width: 100%; max-width: 420px; border-radius: 14px;
    box-shadow: 0 8px 32px rgba(11,37,69,0.15); overflow: hidden;
  }
  .login-header {
    background: linear-gradient(135deg, var(--navy), var(--navy-lighter));
    color: #fff; padding: 32px 28px 24px; text-align: center; border-bottom: 4px solid var(--gold);
  }
  .login-header h1 { margin: 0 0 4px; font-size: 22px; }
  .login-header p { margin: 0; font-size: 13px; opacity: 0.8; }
  .login-body { padding: 28px; }

  label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: var(--navy); }
  input, select, textarea {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px;
    font-size: 14px; margin-bottom: 14px; font-family: inherit; background: #fff; color: var(--text);
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }
  textarea { min-height: 80px; resize: vertical; }

  button {
    padding: 10px 18px; background: var(--navy); color: #fff; border: none; border-radius: 8px;
    font-size: 14px; font-weight: bold; cursor: pointer; transition: background 0.15s; font-family: inherit;
  }
  button:hover:not(:disabled) { background: var(--navy-lighter); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  button.full { width: 100%; }
  button.secondary { background: #fff; color: var(--navy); border: 1.5px solid var(--navy); }
  button.secondary:hover:not(:disabled) { background: var(--bg); }
  button.gold { background: var(--gold); color: #1a1a1a; }
  button.gold:hover:not(:disabled) { background: var(--gold-light); }
  button.danger { background: var(--danger); }
  button.danger:hover:not(:disabled) { background: #a53125; }
  button.small { padding: 6px 12px; font-size: 12px; }

  .msg-box { padding: 12px 14px; border-radius: 8px; font-size: 13px; margin-top: 12px; white-space: pre-wrap; word-break: break-word; }
  .msg-error { background: var(--danger-bg); border: 1px solid var(--danger); color: var(--danger); }
  .msg-success { background: var(--success-bg); border: 1px solid var(--success); color: var(--success); }
  .msg-warn { background: var(--warn-bg); border: 1px solid var(--gold-light); color: var(--warn); }

  /* ===== الشِل بعد الدخول ===== */
  .topbar {
    background: var(--navy); color: #fff; padding: 14px 24px; display: flex;
    align-items: center; justify-content: space-between; border-bottom: 3px solid var(--gold);
  }
  .topbar .brand { font-weight: bold; font-size: 16px; }
  .topbar .brand span { color: var(--gold-light); }
  .topbar .who { font-size: 13px; opacity: 0.85; margin-inline-end: 14px; }
  .topbar-right { display: flex; align-items: center; }

  .tabs { display: flex; gap: 6px; background: #fff; padding: 10px 24px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .tab-btn {
    background: transparent; color: var(--muted); border: none; border-bottom: 3px solid transparent;
    border-radius: 0; padding: 10px 16px; font-weight: bold; font-size: 14px;
  }
  .tab-btn.active { color: var(--navy); border-bottom-color: var(--gold); }
  .tab-btn:hover:not(.active) { color: var(--navy); background: transparent; }

  .main { flex: 1; padding: 24px; max-width: 1100px; width: 100%; margin: 0 auto; }
  .panel { background: var(--card); border-radius: 12px; border: 1px solid var(--border); padding: 22px; margin-bottom: 18px; }
  .panel h2 { margin: 0 0 16px; font-size: 17px; color: var(--navy); }
  .panel h3 { margin: 18px 0 10px; font-size: 14px; color: var(--navy); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px; text-align: right; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { color: var(--navy); background: var(--bg); font-size: 12px; }
  tr:hover td { background: #fafbfc; }
  .empty-row { text-align: center; color: var(--muted); padding: 24px !important; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
  .badge-pending { background: var(--warn-bg); color: var(--warn); }
  .badge-active, .badge-approved, .badge-accepted { background: var(--success-bg); color: var(--success); }
  .badge-rejected, .badge-revoked { background: var(--danger-bg); color: var(--danger); }
  .badge-archived, .badge-suspended { background: #eee; color: #666; }
  .badge-under_review, .badge-needs_more_info, .badge-in_progress, .badge-submitted, .badge-needs_revision { background: #eaf1fb; color: var(--navy-lighter); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(11,37,69,0.45); display: none;
    align-items: center; justify-content: center; z-index: 50; padding: 16px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box { background: #fff; border-radius: 12px; max-width: 480px; width: 100%; padding: 24px; max-height: 90vh; overflow-y: auto; }
  .modal-box h3 { margin-top: 0; color: var(--navy); }
  .modal-actions { display: flex; gap: 10px; margin-top: 10px; }

  .nda-text { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; max-height: 320px; overflow-y: auto; font-size: 13px; line-height: 2; white-space: pre-wrap; margin-bottom: 16px; }
  .ack-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; font-size: 13px; }
  .ack-row input { width: auto; margin: 3px 0 0; flex-shrink: 0; }

  .credential-box { background: var(--warn-bg); border: 1px solid var(--gold-light); border-radius: 8px; padding: 14px; font-size: 13px; margin-top: 12px; }
  .credential-box code { background: #fff; border: 1px solid var(--gold-light); padding: 2px 8px; border-radius: 5px; direction: ltr; display: inline-block; font-family: 'Consolas', monospace; }

  .loading { text-align: center; padding: 40px; color: var(--muted); }
  .actions-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .hidden { display: none !important; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .split { grid-template-columns: 1fr; } .main { padding: 14px; } }
</style>
</head>
<body>
<div id="app">
  <div class="loading" id="initialLoading">جارِ التحميل...</div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>
// ============================================================================
// منصة تدريب مدارج — الواجهة الموحّدة (نسخة أولى)
// رابط واحد، تسجيل دخول Supabase Auth حقيقي، توجيه تلقائي حسب الدور.
// ============================================================================

const SUPABASE_URL = "https://suqqkfgwybhmipyflcfo.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1cXFrZmd3eWJobWlweWZsY2ZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2OTkzNzQsImV4cCI6MjEwMTI3NTM3NH0.HSCi8np0BuhqYAfl7ps-bWXntgu-PEs0x5uZPm-Bfw0";

const sb = window.supabase.createClient(SUPABASE_URL, ANON_KEY);

const state = {
  session: null,
  isAdminOrManager: false,
  isStaff: false,
  myTraineeId: null,
  myTrainee: null,
  activeStaffTab: 'applications',
  activeTraineeTab: 'tasks',
  selectedTraineeId: null,
};

const STATUS_LABELS = {
  pending: 'قيد الانتظار', under_review: 'قيد المراجعة', needs_more_info: 'يحتاج معلومات إضافية',
  accepted: 'مقبول', rejected: 'مرفوض',
  pending_account: 'بانتظار إنشاء حساب', active: 'نشط', suspended: 'موقوف', archived: 'مؤرشف',
  assigned: 'مُكلّف', in_progress: 'قيد التنفيذ', submitted: 'تم التسليم', approved: 'مقبولة', needs_revision: 'تحتاج تعديل',
  completion: 'إتمام', excellence: 'تفوق', participation: 'مشاركة',
};
function statusLabel(s) { return STATUS_LABELS[s] || s || '—'; }
function badge(s) { return `<span class="badge badge-${s}">${statusLabel(s)}</span>`; }
function esc(str) {
  const d = document.createElement('div'); d.textContent = str ?? ''; return d.innerHTML;
}
function fmtDate(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('ar-SA'); }

function openModal(html) {
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('modalBox').innerHTML = '';
}
document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'modalOverlay') closeModal();
});

async function authedFetch(path, body) {
  const { data: sessionData } = await sb.auth.getSession();
  const token = sessionData?.session?.access_token;
  const res = await fetch(`${SUPABASE_URL}/functions/v1/${path}`, {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${token}`, 'apikey': ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `خطأ HTTP ${res.status}`);
  return data;
}

// ============================================================================
// الدخول والتوجيه
// ============================================================================

async function init() {
  const { data } = await sb.auth.getSession();
  if (data?.session) {
    state.session = data.session;
    await postLogin();
  } else {
    renderLogin();
  }
}

function renderLogin(errorMsg) {
  document.getElementById('app').innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-header">
          <h1>منصة تدريب <span>مدارج</span></h1>
          <p>سجّل دخولك للمتابعة</p>
        </div>
        <div class="login-body">
          <label for="loginEmail">الإيميل</label>
          <input id="loginEmail" type="email" placeholder="name@example.com" autocomplete="username">
          <label for="loginPassword">كلمة المرور</label>
          <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password">
          <button class="full" id="loginBtn" onclick="doLogin()">تسجيل الدخول</button>
          <div id="loginMsg">${errorMsg ? `<div class="msg-box msg-error">${esc(errorMsg)}</div>` : ''}</div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('loginPassword').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginBtn');
  const msgEl = document.getElementById('loginMsg');
  if (!email || !password) {
    msgEl.innerHTML = `<div class="msg-box msg-error">اكتب الإيميل وكلمة المرور.</div>`;
    return;
  }
  btn.disabled = true; btn.textContent = 'جارِ الدخول...';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    btn.disabled = false; btn.textContent = 'تسجيل الدخول';
    msgEl.innerHTML = `<div class="msg-box msg-error">فشل تسجيل الدخول: ${esc(error.message)}</div>`;
    return;
  }
  state.session = data.session;
  await postLogin();
}

async function logout() {
  await sb.auth.signOut();
  Object.assign(state, { session: null, isAdminOrManager: false, isStaff: false, myTraineeId: null, myTrainee: null });
  renderLogin();
}

async function postLogin() {
  document.getElementById('app').innerHTML = `<div class="loading">جارِ تجهيز حسابك...</div>`;

  const [{ data: isManager }, { data: isStaffRes }] = await Promise.all([
    sb.rpc('is_admin_or_manager'),
    sb.rpc('is_staff'),
  ]);
  state.isAdminOrManager = !!isManager;
  state.isStaff = !!isStaffRes;

  const { data: taRow } = await sb.from('temp_accounts')
    .select('trainee_id, account_status, trainees(id, full_name, status)')
    .eq('auth_user_id', state.session.user.id)
    .maybeSingle();

  if (taRow) {
    state.myTraineeId = taRow.trainee_id;
    state.myTrainee = taRow.trainees;
  }

  if (state.isStaff) {
    renderShell('staff');
    await renderStaffTab('applications');
  } else if (state.myTraineeId) {
    renderShell('trainee');
    await checkNdaAndRenderTrainee();
  } else {
    document.getElementById('app').innerHTML = `
      <div class="login-wrap"><div class="login-card"><div class="login-body">
        <div class="msg-box msg-warn">تم تسجيل دخولك بنجاح، لكن حسابك غير مرتبط بأي دور معروف في منصة التدريب (لا موظف ولا متدرب).
        تواصل مع الإدارة لمراجعة حسابك.</div>
        <button class="full secondary" style="margin-top:14px" onclick="logout()">تسجيل خروج</button>
      </div></div></div>`;
  }
}

function renderShell(kind) {
  const email = state.session.user.email;
  const tabsHtml = kind === 'staff'
    ? `
      <button class="tab-btn" data-tab="applications" onclick="renderStaffTab('applications')">طلبات التدريب</button>
      <button class="tab-btn" data-tab="trainees" onclick="renderStaffTab('trainees')">المتدربون</button>
      <button class="tab-btn" data-tab="tracks" onclick="renderStaffTab('tracks')">المسارات التدريبية</button>
    `
    : `
      <button class="tab-btn" data-tab="tasks" onclick="renderTraineeTab('tasks')">مهامي</button>
      <button class="tab-btn" data-tab="evaluations" onclick="renderTraineeTab('evaluations')">تقييماتي</button>
      <button class="tab-btn" data-tab="certificates" onclick="renderTraineeTab('certificates')">شهاداتي</button>
    `;

  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <div class="brand">منصة تدريب <span>مدارج</span></div>
      <div class="topbar-right">
        <span class="who">${esc(email)}</span>
        <button class="small secondary" onclick="logout()">تسجيل خروج</button>
      </div>
    </div>
    <div class="tabs" id="tabsBar">${tabsHtml}</div>
    <div class="main" id="mainContent"><div class="loading">جارِ التحميل...</div></div>
  `;
}

function setActiveTabBtn(tabKey) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabKey));
}

// ============================================================================
// واجهة المتدرب
// ============================================================================

async function checkNdaAndRenderTrainee() {
  const { data: valid } = await sb.rpc('has_valid_nda_signature');
  if (!valid) {
    await renderNdaGate();
  } else {
    await renderTraineeTab('tasks');
  }
}

async function renderNdaGate() {
  document.getElementById('tabsBar').classList.add('hidden');
  const main = document.getElementById('mainContent');
  main.innerHTML = `<div class="loading">جارِ تحميل اتفاقية عدم الإفشاء...</div>`;

  const { data: ndaVersion, error } = await sb.from('nda_policy_versions')
    .select('*').eq('is_active', true).order('created_at', { ascending: false }).limit(1).maybeSingle();

  if (error || !ndaVersion) {
    main.innerHTML = `<div class="panel"><div class="msg-box msg-error">تعذّر تحميل نص اتفاقية عدم الإفشاء. تواصل مع الإدارة.</div></div>`;
    return;
  }

  main.innerHTML = `
    <div class="panel">
      <h2>قبل المتابعة — اتفاقية عدم الإفشاء (NDA)</h2>
      <div class="msg-box msg-warn">يجب توقيع هذه الاتفاقية قبل الوصول لأي جزء آخر من المنصة.</div>
      <div class="nda-text">${esc(ndaVersion.full_text)}</div>
      <div class="ack-row"><input type="checkbox" id="ack1"><label style="margin:0" for="ack1">قرأت النص وفهمته بالكامل</label></div>
      <div class="ack-row"><input type="checkbox" id="ack2"><label style="margin:0" for="ack2">ألتزم بسرية كل المعلومات التي سأطّلع عليها</label></div>
      <div class="ack-row"><input type="checkbox" id="ack3"><label style="margin:0" for="ack3">لن أشارك أو أنشر أي معلومة أو مستند دون إذن كتابي</label></div>
      <div class="ack-row"><input type="checkbox" id="ack4"><label style="margin:0" for="ack4">أتحمّل المسؤولية الكاملة عن أي مخالفة لهذه الاتفاقية</label></div>
      <label for="ndaFullName">اكتب اسمك الكامل تأكيداً لتوقيعك</label>
      <input id="ndaFullName" type="text" placeholder="الاسم الكامل">
      <button class="full gold" onclick="submitNda('${ndaVersion.id}')">توقيع وموافقة</button>
      <div id="ndaMsg"></div>
    </div>
  `;
}

async function submitNda(versionId) {
  const ack1 = document.getElementById('ack1').checked;
  const ack2 = document.getElementById('ack2').checked;
  const ack3 = document.getElementById('ack3').checked;
  const ack4 = document.getElementById('ack4').checked;
  const fullName = document.getElementById('ndaFullName').value.trim();
  const msgEl = document.getElementById('ndaMsg');

  if (!ack1 || !ack2 || !ack3 || !ack4) {
    msgEl.innerHTML = `<div class="msg-box msg-error">يجب الموافقة على جميع البنود الأربعة.</div>`;
    return;
  }
  if (!fullName) {
    msgEl.innerHTML = `<div class="msg-box msg-error">اكتب اسمك الكامل.</div>`;
    return;
  }

  const { error } = await sb.rpc('sign_nda', {
    p_full_name_entered: fullName,
    p_ack_read_understood: ack1,
    p_ack_confidentiality: ack2,
    p_ack_no_share_publish: ack3,
    p_ack_own_responsibility: ack4,
    p_session_info: { user_agent: navigator.userAgent, signed_from: 'web' },
  });

  if (error) {
    msgEl.innerHTML = `<div class="msg-box msg-error">فشل التوقيع: ${esc(error.message)}</div>`;
    return;
  }

  document.getElementById('tabsBar').classList.remove('hidden');
  await renderTraineeTab('tasks');
}

async function renderTraineeTab(tab) {
  state.activeTraineeTab = tab;
  document.getElementById('tabsBar').classList.remove('hidden');
  setActiveTabBtn(tab);
  const main = document.getElementById('mainContent');
  main.innerHTML = `<div class="loading">جارِ التحميل...</div>`;

  if (tab === 'tasks') {
    const { data: tasks } = await sb.from('tasks').select('*').eq('trainee_id', state.myTraineeId).order('created_at', { ascending: false });
    main.innerHTML = `<div class="panel"><h2>مهامي</h2>${renderTasksTable(tasks || [], true)}</div>`;
  } else if (tab === 'evaluations') {
    const { data: evals } = await sb.from('evaluations').select('*').eq('trainee_id', state.myTraineeId).order('evaluated_at', { ascending: false });
    main.innerHTML = `<div class="panel"><h2>تقييماتي</h2>${renderEvaluationsTable(evals || [])}</div>`;
  } else if (tab === 'certificates') {
    const { data: certs } = await sb.from('certificates').select('*').eq('trainee_id', state.myTraineeId).order('issued_at', { ascending: false });
    main.innerHTML = `<div class="panel"><h2>شهاداتي</h2>${renderCertificatesTable(certs || [], false)}</div>`;
  }
}

function renderTasksTable(tasks, mine) {
  if (!tasks.length) return `<table><tr><td class="empty-row">لا توجد مهام بعد</td></tr></table>`;
  const rows = tasks.map(t => `
    <tr>
      <td>${esc(t.title)}</td>
      <td>${fmtDate(t.due_date)}</td>
      <td>${badge(t.status)}</td>
      <td>
        ${mine && ['assigned', 'in_progress', 'needs_revision'].includes(t.status)
          ? `<button class="small gold" onclick="openSubmitTaskModal('${t.id}', '${esc(t.title).replace(/'/g, "\\'")}')">تسليم</button>`
          : ''}
      </td>
    </tr>
  `).join('');
  return `<table><thead><tr><th>العنوان</th><th>الموعد النهائي</th><th>الحالة</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

function openSubmitTaskModal(taskId, title) {
  openModal(`
    <h3>تسليم مهمة: ${esc(title)}</h3>
    <label>نص التسليم</label>
    <textarea id="subText" placeholder="اكتب تفاصيل إنجازك..."></textarea>
    <label>رابط (اختياري)</label>
    <input id="subUrl" type="url" placeholder="https://...">
    <div id="subModalMsg"></div>
    <div class="modal-actions">
      <button class="gold" onclick="submitTaskAction('${taskId}')">إرسال التسليم</button>
      <button class="secondary" onclick="closeModal()">إلغاء</button>
    </div>
  `);
}

async function submitTaskAction(taskId) {
  const text = document.getElementById('subText').value.trim();
  const url = document.getElementById('subUrl').value.trim();
  const msgEl = document.getElementById('subModalMsg');
  const { error } = await sb.rpc('submit_task', { p_task_id: taskId, p_submission_text: text || null, p_submission_url: url || null });
  if (error) { msgEl.innerHTML = `<div class="msg-box msg-error">${esc(error.message)}</div>`; return; }
  closeModal();
  await renderTraineeTab('tasks');
}

function renderEvaluationsTable(evals) {
  if (!evals.length) return `<table><tr><td class="empty-row">لا توجد تقييمات بعد</td></tr></table>`;
  const rows = evals.map(e => `
    <tr><td>${fmtDate(e.evaluated_at)}</td><td>${e.score ?? '—'}</td><td>${esc(e.notes || '—')}</td></tr>
  `).join('');
  return `<table><thead><tr><th>التاريخ</th><th>الدرجة</th><th>ملاحظات</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function renderCertificatesTable(certs, isStaffView) {
  if (!certs.length) return `<table><tr><td class="empty-row">لا توجد شهادات بعد</td></tr></table>`;
  const rows = certs.map(c => `
    <tr>
      <td>${statusLabel(c.certificate_type)}</td>
      <td>${fmtDate(c.issued_at)}</td>
      <td>${c.revoked ? badge('revoked') : badge('active')}</td>
      <td><button class="small secondary" onclick="downloadCertificate('${c.id}')">تحميل PDF</button></td>
    </tr>
  `).join('');
  return `<table><thead><tr><th>النوع</th><th>تاريخ الإصدار</th><th>الحالة</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

async function downloadCertificate(certId) {
  try {
    const data = await authedFetch('certificate-pdf', { certificate_id: certId });
    window.open(data.download_url, '_blank');
  } catch (err) {
    alert('تعذّر تحميل الشهادة: ' + err.message);
  }
}

// ============================================================================
// واجهة الإداري / الموظف
// ============================================================================

async function renderStaffTab(tab) {
  state.activeStaffTab = tab;
  setActiveTabBtn(tab);
  const main = document.getElementById('mainContent');
  main.innerHTML = `<div class="loading">جارِ التحميل...</div>`;

  if (tab === 'applications') await renderApplicationsTab(main);
  else if (tab === 'trainees') await renderTraineesTab(main);
  else if (tab === 'tracks') await renderTracksTab(main);
}

async function renderApplicationsTab(main) {
  const { data: apps } = await sb.from('training_applications').select('*').order('submitted_at', { ascending: false });
  const rows = (apps || []).map(a => `
    <tr>
      <td>${esc(a.full_name)}</td>
      <td dir="ltr">${esc(a.email)}</td>
      <td>${fmtDate(a.submitted_at)}</td>
      <td>${badge(a.status)}</td>
      <td class="actions-row">
        ${state.isAdminOrManager && !['accepted', 'rejected'].includes(a.status) ? `
          <button class="small gold" onclick="openAcceptModal('${a.id}')">قبول</button>
          <button class="small danger" onclick="reviewApplicationAction('${a.id}', 'rejected')">رفض</button>
        ` : ''}
      </td>
    </tr>
  `).join('') || `<tr><td class="empty-row" colspan="5">لا توجد طلبات بعد</td></tr>`;

  main.innerHTML = `
    <div class="panel">
      <h2>طلبات التدريب</h2>
      <div class="actions-row" style="margin-bottom:14px">
        <button onclick="openNewApplicationModal()">+ إضافة طلب يدوياً</button>
      </div>
      <table><thead><tr><th>الاسم</th><th>الإيميل</th><th>تاريخ التقديم</th><th>الحالة</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    </div>
  `;
}

function openNewApplicationModal() {
  openModal(`
    <h3>إضافة طلب تدريب يدوياً</h3>
    <label>الاسم الكامل</label><input id="napFullName" type="text">
    <label>الإيميل</label><input id="napEmail" type="email">
    <label>رقم الهوية (اختياري)</label><input id="napNationalId" type="text">
    <label>الجوال (اختياري)</label><input id="napPhone" type="text">
    <label>الجامعة (اختياري)</label><input id="napUniversity" type="text">
    <label>التخصص (اختياري)</label><input id="napMajor" type="text">
    <div id="napMsg"></div>
    <div class="modal-actions">
      <button class="gold" onclick="submitNewApplication()">إضافة</button>
      <button class="secondary" onclick="closeModal()">إلغاء</button>
    </div>
  `);
}

async function submitNewApplication() {
  const full_name = document.getElementById('napFullName').value.trim();
  const email = document.getElementById('napEmail').value.trim();
  const msgEl = document.getElementById('napMsg');
  if (!full_name || !email) { msgEl.innerHTML = `<div class="msg-box msg-error">الاسم والإيميل مطلوبان.</div>`; return; }

  const { error } = await sb.rpc('submit_application_manual', {
    p_full_name: full_name, p_email: email,
    p_national_id: document.getElementById('napNationalId').value.trim() || null,
    p_phone: document.getElementById('napPhone').value.trim() || null,
    p_university: document.getElementById('napUniversity').value.trim() || null,
    p_major: document.getElementById('napMajor').value.trim() || null,
  });
  if (error) { msgEl.innerHTML = `<div class="msg-box msg-error">${esc(error.message)}</div>`; return; }
  closeModal();
  await renderStaffTab('applications');
}

async function reviewApplicationAction(appId, status) {
  if (!confirm('تأكيد رفض هذا الطلب؟')) return;
  const { error } = await sb.rpc('review_application', { p_application_id: appId, p_new_status: status });
  if (error) { alert(error.message); return; }
  await renderStaffTab('applications');
}

async function openAcceptModal(appId) {
  const [{ data: tracks }, { data: supervisors }] = await Promise.all([
    sb.from('training_tracks').select('id, name').eq('is_active', true),
    sb.from('profiles').select('id, full_name').not('role', 'is', null).in('role', ['supervisor', 'training_manager', 'admin']),
  ]);
  const trackOptions = (tracks || []).map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('');
  const supOptions = (supervisors || []).map(s => `<option value="${s.id}">${esc(s.full_name)}</option>`).join('');

  openModal(`
    <h3>قبول الطلب وتحويله لمتدرب</h3>
    <label>المسار التدريبي</label><select id="accTrack"><option value="">— بدون —</option>${trackOptions}</select>
    <label>المشرف</label><select id="accSupervisor"><option value="">— بدون —</option>${supOptions}</select>
    <label>القسم</label><input id="accDept" type="text">
    <div class="split">
      <div><label>تاريخ البداية</label><input id="accStart" type="date"></div>
      <div><label>تاريخ النهاية</label><input id="accEnd" type="date"></div>
    </div>
    <div id="accMsg"></div>
    <div class="modal-actions">
      <button class="gold" onclick="acceptApplicationAction('${appId}')">تأكيد القبول</button>
      <button class="secondary" onclick="closeModal()">إلغاء</button>
    </div>
  `);
}

async function acceptApplicationAction(appId) {
  const track = document.getElementById('accTrack').value || null;
  const supervisor = document.getElementById('accSupervisor').value || null;
  const dept = document.getElementById('accDept').value.trim() || null;
  const start = document.getElementById('accStart').value || null;
  const end = document.getElementById('accEnd').value || null;
  const msgEl = document.getElementById('accMsg');
  if (!start || !end) { msgEl.innerHTML = `<div class="msg-box msg-error">تاريخ البداية والنهاية مطلوبان.</div>`; return; }

  const { error } = await sb.rpc('accept_application', {
    p_application_id: appId, p_track_id: track, p_supervisor_id: supervisor,
    p_department: dept, p_start_date: start, p_end_date: end,
  });
  if (error) { msgEl.innerHTML = `<div class="msg-box msg-error">${esc(error.message)}</div>`; return; }
  closeModal();
  await renderStaffTab('applications');
}

async function renderTraineesTab(main) {
  const { data: trainees } = await sb.from('trainees').select('*, training_tracks(name)').order('created_at', { ascending: false });
  const rows = (trainees || []).map(t => `
    <tr style="cursor:pointer" onclick="viewTraineeDetail('${t.id}')">
      <td>${esc(t.full_name)}</td>
      <td>${esc(t.trainee_number)}</td>
      <td>${esc(t.training_tracks?.name || '—')}</td>
      <td>${badge(t.status)}</td>
    </tr>
  `).join('') || `<tr><td class="empty-row" colspan="4">لا يوجد متدربون بعد</td></tr>`;

  main.innerHTML = `
    <div class="panel">
      <h2>المتدربون</h2>
      <table><thead><tr><th>الاسم</th><th>الرقم التدريبي</th><th>المسار</th><th>الحالة</th></tr></thead><tbody>${rows}</tbody></table>
    </div>
    <div class="panel" id="traineeDetailPanel"></div>
  `;
}

async function viewTraineeDetail(traineeId) {
  state.selectedTraineeId = traineeId;
  const panel = document.getElementById('traineeDetailPanel');
  panel.innerHTML = `<div class="loading">جارِ التحميل...</div>`;

  const [{ data: trainee }, { data: tasks }, { data: evals }, { data: certs }, { data: tempAcc }] = await Promise.all([
    sb.from('trainees').select('*, training_tracks(name)').eq('id', traineeId).single(),
    sb.from('tasks').select('*').eq('trainee_id', traineeId).order('created_at', { ascending: false }),
    sb.from('evaluations').select('*').eq('trainee_id', traineeId).order('evaluated_at', { ascending: false }),
    sb.from('certificates').select('*').eq('trainee_id', traineeId).order('issued_at', { ascending: false }),
    sb.from('temp_accounts').select('*').eq('trainee_id', traineeId).maybeSingle(),
  ]);

  if (!trainee) { panel.innerHTML = `<div class="msg-box msg-error">تعذّر تحميل بيانات المتدرب.</div>`; return; }

  panel.innerHTML = `
    <h2>${esc(trainee.full_name)} <span style="font-size:13px;color:var(--muted)">(${esc(trainee.trainee_number)})</span></h2>
    <p style="font-size:13px;color:var(--muted)">${esc(trainee.email)} · ${esc(trainee.training_tracks?.name || 'بدون مسار')} · ${badge(trainee.status)}</p>

    ${trainee.status === 'pending_account' && state.isAdminOrManager ? `
      <div class="msg-box msg-warn">
        لا يوجد حساب دخول لهذا المتدرب بعد.
        <div class="split" style="margin-top:10px">
          <div><label>بداية الحساب</label><input id="taStart" type="date" value="${trainee.start_date || ''}"></div>
          <div><label>نهاية الحساب</label><input id="taEnd" type="date" value="${trainee.end_date || ''}"></div>
        </div>
        <button class="gold" onclick="createTempAccountAction('${trainee.id}')">إنشاء حساب دخول مؤقت</button>
        <div id="taMsg"></div>
      </div>
    ` : ''}

    <h3>المهام</h3>
    ${renderTasksTable(tasks || [], false)}
    ${state.isStaff ? `<button class="small" style="margin-top:8px" onclick="openNewTaskModal('${traineeId}')">+ مهمة جديدة</button>` : ''}

    <h3>التقييمات</h3>
    ${renderEvaluationsTable(evals || [])}
    ${state.isStaff ? `<button class="small" style="margin-top:8px" onclick="openNewEvaluationModal('${traineeId}')">+ تقييم جديد</button>` : ''}

    <h3>الشهادات</h3>
    ${renderCertificatesTable(certs || [], true)}
    ${state.isAdminOrManager ? `<button class="small gold" style="margin-top:8px" onclick="openIssueCertModal('${traineeId}')">+ إصدار شهادة</button>` : ''}
  `;
}

async function createTempAccountAction(traineeId) {
  const starts = document.getElementById('taStart').value;
  const ends = document.getElementById('taEnd').value;
  const msgEl = document.getElementById('taMsg');
  if (!starts || !ends) { msgEl.innerHTML = `<div class="msg-box msg-error">التواريخ مطلوبة.</div>`; return; }
  try {
    const data = await authedFetch('create-temp-account', { trainee_id: traineeId, starts_at: starts, ends_at: ends });
    msgEl.innerHTML = `
      <div class="credential-box">
        <b>تم إنشاء الحساب! سلّم هذه البيانات للمتدرب خارج النظام فوراً — لن تظهر مرة أخرى:</b><br>
        اسم المستخدم: <code>${esc(data.username)}</code><br>
        كلمة المرور: <code>${esc(data.temporary_password)}</code>
      </div>`;
    setTimeout(() => viewTraineeDetail(traineeId), 4000);
  } catch (err) {
    msgEl.innerHTML = `<div class="msg-box msg-error">${esc(err.message)}</div>`;
  }
}

function openNewTaskModal(traineeId) {
  openModal(`
    <h3>مهمة جديدة</h3>
    <label>العنوان</label><input id="ntTitle" type="text">
    <label>الوصف (اختياري)</label><textarea id="ntDesc"></textarea>
    <label>الموعد النهائي (اختياري)</label><input id="ntDue" type="date">
    <div id="ntMsg"></div>
    <div class="modal-actions">
      <button class="gold" onclick="createTaskAction('${traineeId}')">إضافة</button>
      <button class="secondary" onclick="closeModal()">إلغاء</button>
    </div>
  `);
}

async function createTaskAction(traineeId) {
  const title = document.getElementById('ntTitle').value.trim();
  const msgEl = document.getElementById('ntMsg');
  if (!title) { msgEl.innerHTML = `<div class="msg-box msg-error">العنوان مطلوب.</div>`; return; }
  const { error } = await sb.rpc('create_task', {
    p_trainee_id: traineeId, p_title: title,
    p_description: document.getElementById('ntDesc').value.trim() || null,
    p_due_date: document.getElementById('ntDue').value || null,
  });
  if (error) { msgEl.innerHTML = `<div class="msg-box msg-error">${esc(error.message)}</div>`; return; }
  closeModal();
  await viewTraineeDetail(traineeId);
}

function openNewEvaluationModal(traineeId) {
  openModal(`
    <h3>تقييم جديد</h3>
    <label>الدرجة (0-100)</label><input id="neScore" type="number" min="0" max="100">
    <label>ملاحظات (اختياري)</label><textarea id="neNotes"></textarea>
    <div id="neMsg"></div>
    <div class="modal-actions">
      <button class="gold" onclick="createEvaluationAction('${traineeId}')">حفظ التقييم</button>
      <button class="secondary" onclick="closeModal()">إلغاء</button>
    </div>
  `);
}

async function createEvaluationAction(traineeId) {
  const score = document.getElementById('neScore').value;
  const msgEl = document.getElementById('neMsg');
  const { error } = await sb.rpc('create_evaluation', {
    p_trainee_id: traineeId, p_score: score === '' ? null : Number(score),
    p_notes: document.getElementById('neNotes').value.trim() || null,
  });
  if (error) { msgEl.innerHTML = `<div class="msg-box msg-error">${esc(error.message)}</div>`; return; }
  closeModal();
  await viewTraineeDetail(traineeId);
}

function openIssueCertModal(traineeId) {
  openModal(`
    <h3>إصدار شهادة</h3>
    <label>نوع الشهادة</label>
    <select id="icType">
      <option value="completion">شهادة إتمام</option>
      <option value="excellence">شهادة تفوق</option>
      <option value="participation">شهادة مشاركة</option>
    </select>
    <div id="icMsg"></div>
    <div class="modal-actions">
      <button class="gold" onclick="issueCertAction('${traineeId}')">إصدار</button>
      <button class="secondary" onclick="closeModal()">إلغاء</button>
    </div>
  `);
}

async function issueCertAction(traineeId) {
  const type = document.getElementById('icType').value;
  const msgEl = document.getElementById('icMsg');
  const { data: certId, error } = await sb.rpc('issue_certificate', { p_trainee_id: traineeId, p_certificate_type: type });
  if (error) { msgEl.innerHTML = `<div class="msg-box msg-error">${esc(error.message)}</div>`; return; }
  try {
    await authedFetch('certificate-pdf', { certificate_id: certId });
  } catch (e) { /* توليد PDF قد يحتاج إعادة محاولة لاحقاً من "تحميل PDF" — لا نفشل الإصدار بسببه */ }
  closeModal();
  await viewTraineeDetail(traineeId);
}

async function renderTracksTab(main) {
  const { data: tracks } = await sb.from('training_tracks').select('*').order('created_at', { ascending: false });
  const rows = (tracks || []).map(t => `
    <tr><td>${esc(t.name)}</td><td>${esc(t.description || '—')}</td><td>${t.is_active ? badge('active') : badge('archived')}</td></tr>
  `).join('') || `<tr><td class="empty-row" colspan="3">لا توجد مسارات بعد</td></tr>`;

  main.innerHTML = `
    <div class="panel">
      <h2>المسارات التدريبية</h2>
      ${state.isAdminOrManager ? `
        <div class="actions-row" style="margin-bottom:14px">
          <input id="newTrackName" type="text" placeholder="اسم مسار جديد" style="max-width:260px;margin-bottom:0">
          <button onclick="addTrackAction()">+ إضافة</button>
        </div>
        <div id="trackMsg"></div>
      ` : ''}
      <table><thead><tr><th>الاسم</th><th>الوصف</th><th>الحالة</th></tr></thead><tbody>${rows}</tbody></table>
    </div>
  `;
}

async function addTrackAction() {
  const name = document.getElementById('newTrackName').value.trim();
  const msgEl = document.getElementById('trackMsg');
  if (!name) { msgEl.innerHTML = `<div class="msg-box msg-error">اكتب اسم المسار.</div>`; return; }
  const { error } = await sb.from('training_tracks').insert({ name });
  if (error) { msgEl.innerHTML = `<div class="msg-box msg-error">${esc(error.message)}</div>`; return; }
  await renderStaffTab('tracks');
}

init();
</script>
</body>
</html>
