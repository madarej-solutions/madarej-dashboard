<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدارج</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --navy: #26344d;
    --navy-light: #2f4160;
    --navy-lighter: #34496c;
    --gold: #c9a227;
    --gold-light: #e0c15a;
    --bg: #0d0d0d;
    --card: #1a1a19;
    --surface2: #222220;
    --border: rgba(255,255,255,.10);
    --axis: #383835;
    --grid: #2c2c2a;
    --text: #ffffff;
    --ink2: #c3c2b7;
    --muted: #898781;
    --active: #26344d;
    --accent: #3987e5;
    --danger: #c0392b;
    --danger-bg: #fdecea;
    --success: #1e7e34;
    --success-bg: #eaf6ec;
    --warn: #8a6d00;
    --warn-bg: rgba(250,178,25,.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Tahoma', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  #app { min-height: 100vh; display: flex; flex-direction: column; }

  /* ===== شاشة الدخول ===== */
  .login-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card {
    background: var(--card); width: 100%; max-width: 420px; border-radius: 14px;
    box-shadow: 0 8px 32px rgba(11,37,69,0.15); overflow: hidden;
  }
  .login-header {
    background: linear-gradient(135deg, var(--navy), var(--navy-lighter));
    color: #fff; padding: 32px 28px 24px; text-align: center; border-bottom: 4px solid var(--gold);
  }
  .login-header h1 { margin: 0 0 4px; font-size: 22px; }
  .login-header p { margin: 0; font-size: 13px; opacity: 0.8; }
  .login-body { padding: 28px; }

  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--ink2); }
  input, select, textarea {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px;
    font-size: 14px; margin-bottom: 14px; font-family: inherit; background: var(--surface2); color: var(--text);
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }
  textarea { min-height: 80px; resize: vertical; }

  button {
    padding: 10px 18px; background: var(--navy); color: #fff; border: none; border-radius: 8px;
    font-size: 14px; font-weight: bold; cursor: pointer; transition: background 0.15s; font-family: inherit;
  }
  button:hover:not(:disabled) { background: var(--navy-lighter); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  button.full { width: 100%; }
  button.secondary { background: var(--surface2); color: var(--ink2); border: 1px solid var(--border); }
  button.secondary:hover:not(:disabled) { background: var(--bg); }
  button.gold { background: var(--gold); color: #1a1a1a; }
  button.gold:hover:not(:disabled) { background: var(--gold-light); }
  button.danger { background: var(--danger); }
  button.danger:hover:not(:disabled) { background: #a53125; }
  button.small { padding: 6px 12px; font-size: 12px; }

  .msg-box { padding: 12px 14px; border-radius: 8px; font-size: 13px; margin-top: 12px; white-space: pre-wrap; word-break: break-word; }
  .msg-error { background: var(--danger-bg); border: 1px solid var(--danger); color: var(--danger); }
  .msg-success { background: var(--success-bg); border: 1px solid var(--success); color: var(--success); }
  .msg-warn { background: var(--warn-bg); border: 1px solid var(--gold-light); color: var(--warn); }

  /* ===== الشِل بعد الدخول ===== */
  .app-shell { display: grid; grid-template-columns: 234px 1fr; min-height: 100vh; }
  .side { background: var(--card); border-left: 1px solid var(--border); padding: 18px 12px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
  .logo { font-weight: 700; font-size: 16px; }
  .logo span { color: var(--gold); font-weight: 400; font-size: 13px; }
  .logo-sub { color: var(--muted); font-size: 11px; margin: 2px 0 16px; }
  .user-card { display: flex; gap: 9px; align-items: center; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 10px; padding: 9px 10px; margin-bottom: 16px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--active); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex: 0 0 auto; }
  .user-meta { min-width: 0; }
  .user-role { font-size: 12.5px; font-weight: 600; }
  .user-mail { font-size: 10.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-btn { display: flex; gap: 8px; align-items: center; width: 100%; text-align: right;
    background: none; border: 0; color: var(--ink2); padding: 9px 10px; border-radius: 8px;
    cursor: pointer; font-size: 13.5px; font-family: inherit; }
  .nav-btn:hover { background: var(--surface2); }
  .nav-btn.on { background: var(--active); color: #fff; font-weight: 600; }
  .nav-btn.danger { color: #ef6b6b; }
  .nav-btn .ic { width: 20px; text-align: center; flex: 0 0 auto; }
  .side-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; }
  .app-body { min-width: 0; }
  .top { display: flex; align-items: center; gap: 12px; padding: 14px 20px;
    border-bottom: 1px solid var(--border); background: var(--card); position: sticky; top: 0; z-index: 5; }
  .top h1 { font-size: 16px; font-weight: 700; margin: 0; }
  .side-toggle { display: none; background: var(--surface2); border: 1px solid var(--border);
    color: var(--ink2); border-radius: 8px; padding: 6px 11px; font-size: 15px; cursor: pointer; }
  @media (max-width: 900px) {
    .app-shell { grid-template-columns: 1fr; }
    .side { position: fixed; inset-inline-end: -260px; top: 0; width: 250px; z-index: 40;
      height: 100vh; transition: inset-inline-end .22s ease; }
    .side.open { inset-inline-end: 0; box-shadow: -8px 0 28px rgba(0,0,0,.5); }
    .side-toggle { display: block; }
  }
  .topbar {
    background: var(--navy); color: #fff; padding: 14px 24px; display: flex;
    align-items: center; justify-content: space-between; border-bottom: 3px solid var(--gold);
  }
  .topbar .brand { font-weight: bold; font-size: 16px; }
  .topbar .brand span { color: var(--gold-light); }
  .topbar .who { font-size: 13px; opacity: 0.85; margin-inline-end: 14px; }
  .topbar-right { display: flex; align-items: center; }

  .tabs { display: flex; gap: 6px; background: #fff; padding: 10px 24px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .tab-btn {
    background: transparent; color: var(--muted); border: none; border-bottom: 3px solid transparent;
    border-radius: 0; padding: 10px 16px; font-weight: bold; font-size: 14px;
  }
  .tab-btn.active { color: var(--navy); border-bottom-color: var(--gold); }
  .tab-btn:hover:not(.active) { color: var(--navy); background: transparent; }

  .main { flex: 1; padding: 24px; max-width: 1100px; width: 100%; margin: 0 auto; }
  .panel { background: var(--card); border-radius: 12px; border: 1px solid var(--border); padding: 22px; margin-bottom: 18px; }
  .panel h2 { margin: 0 0 16px; font-size: 17px; color: var(--text); }
  .panel h3 { margin: 18px 0 10px; font-size: 14px; color: var(--text); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px; text-align: right; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { color: var(--muted); background: var(--surface2); font-size: 12px; }
  tr:hover td { background: #fafbfc; }
  .empty-row { text-align: center; color: var(--muted); padding: 24px !important; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
  .badge-pending { background: var(--warn-bg); color: var(--warn); }
  .badge-active, .badge-approved, .badge-accepted { background: var(--success-bg); color: var(--success); }
  .badge-rejected, .badge-revoked { background: var(--danger-bg); color: var(--danger); }
  .badge-archived, .badge-suspended { background: #eee; color: #666; }
  .badge-under_review, .badge-needs_more_info, .badge-in_progress, .badge-submitted, .badge-needs_revision { background: #eaf1fb; color: var(--navy-lighter); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(11,37,69,0.45); display: none;
    align-items: center; justify-content: center; z-index: 50; padding: 16px;
  }
  .modal-overlay.open { display: flex; }
  .src-self { font-size: 12px; padding: 2px 8px; border-radius: 12px; background: rgba(184,134,10,.16); color: #B8860A; white-space: nowrap; }
  .src-staff { font-size: 12px; padding: 2px 8px; border-radius: 12px; background: rgba(120,130,145,.16); color: #667; white-space: nowrap; }
  .det-wrap { max-height: 58vh; overflow-y: auto; margin: 4px 0 8px; }
  .det-sec { font-size: 12px; letter-spacing: .12em; color: #B8860A; margin: 16px 0 8px; padding-top: 10px; border-top: 1px solid rgba(0,0,0,.08); }
  .det-sec:first-child { margin-top: 0; padding-top: 0; border-top: none; }
  .det-row { display: flex; gap: 12px; padding: 5px 0; font-size: 14px; }
  .det-k { min-width: 160px; color: #6B7A8C; font-size: 13px; }
  .det-v { flex: 1; }
  .det-block { padding: 6px 0; }
  .det-long { white-space: pre-wrap; line-height: 1.7; font-size: 14px; margin-top: 3px; }
  .det-flag { font-size: 13px; padding: 8px 12px; border-radius: 4px; margin-bottom: 12px; }
  .det-flag.ok { background: rgba(30,126,52,.12); color: #1E7E34; }
  .det-flag.warn { background: rgba(184,134,10,.14); color: #8A6100; }
  .kpi-sec { font-size: 12px; letter-spacing: .12em; color: #B8860A; margin: 22px 0 10px;
    padding-top: 14px; border-top: 1px solid rgba(0,0,0,.08); }
  .kpi-sec:first-of-type { margin-top: 6px; padding-top: 0; border-top: none; }
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .kpi { background: rgba(11,37,69,.04); border: 1px solid rgba(11,37,69,.1); border-radius: 6px; padding: 16px 14px; }
  .kpi-n { display: block; font-size: 30px; font-weight: 600; line-height: 1; color: #0B2545;
    font-variant-numeric: tabular-nums; margin-bottom: 6px; }
  .kpi-l { display: block; font-size: 13px; color: #3D4A59; }
  .kpi-s { display: block; font-size: 11.5px; color: #6B7A8C; margin-top: 3px; }
  /* شارات الحالة: الخلفيات الفاتحة تختفي على الداكن — تُستبدل بأسطح شفافة */
  .badge { border: 1px solid transparent; }
  [class*="badge-"] { background: rgba(255,255,255,.07) !important; color: var(--ink2) !important; }
  .badge-active, .badge-accepted, .badge-completed, .badge-passed, .badge-issued {
    background: rgba(12,163,12,.15) !important; color: #39c939 !important; }
  .badge-pending, .badge-pending_account, .badge-under_review, .badge-needs_more_info,
  .badge-in_progress, .badge-submitted, .badge-needs_revision {
    background: rgba(250,178,25,.15) !important; color: #fab219 !important; }
  .badge-rejected, .badge-revoked, .badge-failed, .badge-suspended, .badge-expired {
    background: rgba(208,59,59,.18) !important; color: #ef6b6b !important; }
  .msg-box { border: 1px solid var(--border); }
  .msg-success { background: rgba(12,163,12,.12) !important; color: #62d162 !important; }
  .msg-error { background: rgba(208,59,59,.14) !important; color: #ef8b8b !important; }
  .msg-warn { background: rgba(250,178,25,.12) !important; color: #f0c14b !important; }
  .credential-box { background: rgba(201,162,39,.10); border: 1px solid rgba(201,162,39,.4); }
  .empty-row { color: var(--muted); }
  .loading { color: var(--muted); }
  .kpi { background: var(--surface2) !important; border-color: var(--border) !important; }
  .kpi-n { color: var(--text) !important; }
  .kpi-l { color: var(--ink2) !important; }
  .kpi-s { color: var(--muted) !important; }
  .kpi-sec { border-top-color: var(--border) !important; }
  th { color: var(--muted); border-bottom-color: var(--axis); }
  td { border-bottom-color: var(--grid); color: var(--ink2); }
  tr:hover td { background: var(--surface2); }
  .det-k, .cred-row span, .panel-note, .pending-note { color: var(--muted); }
  .policy-text { background: var(--surface2); border-color: var(--border); }
  .role-sel, #appSearch, .hours-form input, .hours-form select, .policy-ack input[type=text] {
    background: var(--surface2); color: var(--text); border-color: var(--border); }
  .kpi-warn { background: rgba(201,162,39,.12); border-color: rgba(201,162,39,.4); }
  .kpi-warn .kpi-n { color: var(--gold) !important; }
  .pending-banner { margin-bottom: 14px; }
  .pending-note { font-size: 13px; font-weight: 300; margin: 4px 0 10px; opacity: .85; }
  .pending-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .cred-row { display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 7px 0; border-bottom: 1px solid rgba(0,0,0,.07); font-size: 13.5px; }
  .cred-row span { color: #6B7A8C; font-size: 12.5px; }
  .cred-row code { font-size: 14px; font-weight: 600; user-select: all; }
  .cred-note { font-size: 12.5px; color: #6B7A8C; margin-top: 10px; line-height: 1.7; font-weight: 300; }
  .cred-note code { font-size: 12px; }
  .cert-checks { display: flex; flex-direction: column; gap: 1px; background: var(--border);
    border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 4px; }
  .cert-check { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center;
    background: var(--card); padding: 8px 11px; font-size: 13px; }
  .cc-mark { font-weight: 700; text-align: center; }
  .cert-check.ok .cc-mark { color: #39c939; }
  .cert-check.no .cc-mark { color: #ef6b6b; }
  .cc-label { color: var(--ink2); }
  .cc-actual { font-size: 11.5px; color: var(--muted); font-family: ui-monospace, monospace; }
  button.danger { background: rgba(208,59,59,.18); color: #ef6b6b; border: 1px solid rgba(208,59,59,.45); }
  button.danger:hover:not(:disabled) { background: rgba(208,59,59,.3); }
  .policy-gate { max-width: 760px; }
  .policy-block { margin-bottom: 22px; }
  .policy-block h3 { display: flex; align-items: baseline; gap: 8px; margin: 0 0 8px; font-size: 16px; }
  .policy-ver { font-size: 11px; font-family: ui-monospace, monospace; color: #6B7A8C;
    background: rgba(0,0,0,.05); padding: 1px 6px; border-radius: 8px; }
  .policy-text { max-height: 240px; overflow-y: auto; white-space: pre-wrap; line-height: 1.9;
    font-size: 13.5px; padding: 14px 16px; border: 1px solid rgba(0,0,0,.13); border-radius: 6px;
    background: rgba(0,0,0,.02); }
  .policy-ack { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13.5px; }
  .policy-ack input[type=checkbox] { width: 17px; height: 17px; margin: 0; flex: 0 0 auto; }
  .policy-ack input[type=text] { flex: 1; padding: 8px 10px; margin: 0;
    border: 1px solid rgba(0,0,0,.15); border-radius: 4px; font: inherit; font-size: 13.5px; }
  .policy-ack input:disabled + span, .policy-ack input:disabled { opacity: .55; }
  .kpi-warn .kpi-n { color: #8A6100; }
  .panel-note { font-size: 13px; color: #6B7A8C; margin: -6px 0 16px; font-weight: 300; }
  .role-sel { padding: 6px 10px; border: 1px solid rgba(0,0,0,.15); border-radius: 4px; font: inherit; font-size: 13px; }
  .hours-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; align-items: end; }
  .hours-form label { display: block; font-size: 12px; color: #6B7A8C; margin-bottom: 4px; }
  .hours-form input, .hours-form select { width: 100%; padding: 8px 10px; border: 1px solid rgba(0,0,0,.15);
    border-radius: 4px; font: inherit; font-size: 13.5px; margin: 0; }
  .hours-form button { width: 100%; }
  .app-ref { font-family: ui-monospace, "Courier New", monospace; font-size: 12.5px;
    letter-spacing: .5px; color: #B8860A; white-space: nowrap; }
  #appSearch { padding: 8px 12px; border: 1px solid rgba(0,0,0,.15); border-radius: 4px; font: inherit; font-size: 14px; }
  .modal-box { background: var(--card); border-radius: 12px; max-width: 480px; width: 100%; padding: 24px; max-height: 90vh; overflow-y: auto; }
  .modal-box h3 { margin-top: 0; color: var(--text); }
  .modal-actions { display: flex; gap: 10px; margin-top: 10px; }

  .nda-text { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; max-height: 320px; overflow-y: auto; font-size: 13px; line-height: 2; white-space: pre-wrap; margin-bottom: 16px; }
  .ack-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; font-size: 13px; }
  .ack-row input { width: auto; margin: 3px 0 0; flex-shrink: 0; }

  .credential-box { background: var(--warn-bg); border: 1px solid var(--gold-light); border-radius: 8px; padding: 14px; font-size: 13px; margin-top: 12px; }
  .credential-box code { background: var(--surface2); border: 1px solid var(--gold-light); padding: 2px 8px; border-radius: 5px; direction: ltr; display: inline-block; font-family: 'Consolas', monospace; }

  .loading { text-align: center; padding: 40px; color: var(--muted); }
  .actions-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .hidden { display: none !important; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .split { grid-template-columns: 1fr; } .main { padding: 14px; } }

  /* ===== صفحة الهبوط — التصميم الجديد (معزولة: كل الأصناف تبدأ بـ lp-) ===== */
  .lp { position: relative; height: 100svh; min-height: 100svh; background: #131A22; color: #fff;
        font-family: 'IBM Plex Sans Arabic', Tahoma, sans-serif; overflow: hidden;
        display: flex; flex-direction: column; justify-content: space-between; -webkit-font-smoothing: antialiased; }
  .lp a { color: inherit; text-decoration: none; }
  .lp-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .lp-headwrap { position: absolute; z-index: 50; top: 0; right: 0; width: 100%; padding-top: 56px; pointer-events: none; }
  .lp-header { display: flex; align-items: center; justify-content: space-between;
               max-width: 1440px; margin-inline: auto; padding-inline: 48px; pointer-events: auto; }
  .lp-logo { display: block; flex: none; }
  .lp-logo img { width: 76px; height: 76px; border-radius: 9999px; display: block; }
  .lp-nav { position: absolute; right: 50%; transform: translateX(50%); display: flex; align-items: center;
            gap: 40px; font-size: 14px; font-weight: 400; letter-spacing: .06em; }
  .lp-nav a { color: rgba(255,255,255,.6); transition: color .15s ease-out; }
  .lp-nav a:hover { color: #fff; }
  .lp-signin { /* هدف لمس */ font-size: 14px; font-weight: 500; letter-spacing: .06em; color: #9FB6CE;
               background: none; border: none; cursor: pointer; font-family: inherit;
               display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px;
               transition: color .15s ease-out; }
  .lp-signin:hover:not(:disabled) { background: none; color: rgba(159,182,206,.75); }

  .lp-hero { position: relative; z-index: 10; margin-top: auto; padding-bottom: 64px; padding-inline: 24px; text-align: center; }


  .lp-h1 { margin: 0; font-family: 'IBM Plex Sans Arabic', sans-serif; font-weight: 200;
           font-size: clamp(34px, 7vw, 72px); line-height: 1.25; letter-spacing: -.01em; }
  .lp-h1 em { font-family: Amiri, serif; font-weight: 400; font-style: italic; }
  .lp-sub { margin: 32px auto 0; max-width: 460px; font-size: 16px; font-weight: 300; line-height: 1.7;
            color: rgba(255,255,255,.6); text-wrap: balance; }

  .lp-cta { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            height: 91px; width: 264px; max-width: 100%; margin-top: 56px; padding-inline: 24px;
            font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 16px; font-weight: 500; letter-spacing: .04em;
            color: #fff; background: #131A22; border: 1px solid #9FB6CE; border-radius: 0; cursor: pointer;
            transition: all .3s ease-out; box-shadow: inset 0 0 54px 0 rgba(96,124,155,.9);
            clip-path: polygon(16px 0,calc(100% - 16px) 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 calc(100% - 16px),0 16px); }
  .lp-cta:hover:not(:disabled) { background: #131A22; box-shadow: inset 0 0 54px 0 rgba(126,157,190,.95); }
  .lp-cta .c { position: absolute; width: 32px; height: 2px; background: #9FB6CE; }
  .lp-cta .c1 { top: 6.5px; left: 6.5px; transform: rotate(-45deg) translateX(-50%); transform-origin: top; }
  .lp-cta .c2 { bottom: 6.5px; right: 6.5px; transform: rotate(-45deg) translateX(50%); }

  /* لوحة الدخول فوق الهيرو */
  .lp-auth { position: absolute; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center;

async function authedFetch(path, body) {
  const { data: sessionData } = await sb.auth.getSession();
  const token = sessionData?.session?.access_token;
  const res = await fetch(`${SUPABASE_URL}/functions/v1/${path}`, {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${token}`, 'apikey': ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `خطأ HTTP ${res.status}`);
  return data;
}

  try {

  if (errorMsg) lpOpenLogin();

  try {

function lpEscHandler(e) {
  if (e.key === 'Escape') { lpCloseAny(); return; }
  if (e.key !== 'Tab') return;
  // حصر التركيز داخل أي نافذة مفتوحة (الدخول أو التحقق)
  const panel = document.querySelector('.lp-auth.open');
  if (!panel) return;
  const f = [...panel.querySelectorAll('input, button')].filter(el => !el.disabled && el.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

function lpBackdrop(e) {
  if (e.target && e.target.classList && e.target.classList.contains('lp-auth')) lpCloseAny();
}

function lpCloseAny() {
  const open = document.querySelector('.lp-auth.open');
  if (!open) return;
  open.classList.remove('open');
  const back = document.querySelector('.lp-signin');
  if (back) back.focus();
}

const LP_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو',
                   'يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

// تُعبّأ مرة واحدة عند أول فتح للنموذج.
function lpFillDateSelects() {
  const now = new Date();
  const yNow = now.getFullYear();
  ['suStart','suEnd'].forEach(base => {
    const d = document.getElementById(base + 'D');
    const m = document.getElementById(base + 'M');
    const y = document.getElementById(base + 'Y');
    if (!d || !m || !y || d.options.length) return;
    d.innerHTML = '<option value="">اليوم</option>' +
      Array.from({length:31}, (_,i) => '<option value="' + (i+1) + '">' + (i+1) + '</option>').join('');
    m.innerHTML = '<option value="">الشهر</option>' +
      LP_MONTHS.map((n,i) => '<option value="' + (i+1) + '">' + n + '</option>').join('');
    y.innerHTML = '<option value="">السنة</option>' +
      Array.from({length:3}, (_,i) => '<option value="' + (yNow+i) + '">' + (yNow+i) + '</option>').join('');
  });
}

// يعيد YYYY-MM-DD أو '' إن لم تكتمل، أو null إن كان التاريخ غير موجود أصلاً
// (مثل 31 فبراير) — نتحقق بأن جافاسكربت لم تُعِد ترتيبه.
function lpReadDate(base) {
  const g = sfx => (document.getElementById(base + sfx) || {}).value || '';
  const d = parseInt(g('D'),10), m = parseInt(g('M'),10), y = parseInt(g('Y'),10);
  if (!d || !m || !y) return '';
  const dt = new Date(y, m - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
  const p = n => String(n).padStart(2, '0');
  return y + '-' + p(m) + '-' + p(d);
}

// يطلب رمز التحقق. الخادم يفرض حدّي معدّل (3 لكل بريد و120 إجمالاً في الساعة)
// ولا يدّعي الإرسال: إن فشل المزوّد يُلغى الرمز ويعود خطأ صريح.
let lpCodeTimer = null;
async function lpRequestCode() {
  const btn = document.getElementById('suCodeBtn');
  const msg = document.getElementById('suCodeMsg');
  const email = (document.getElementById('suEmail').value || '').trim();
  const show = (cls, t) => { msg.innerHTML = '<div class="msg-box ' + cls + '">' + t + '</div>'; };

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
    return show('msg-error', 'اكتب بريدك الإلكتروني أولاً.');
  }

  btn.disabled = true; btn.textContent = 'جارِ الإرسال...'; msg.innerHTML = '';
  try {
    const res = await fetch(SUPABASE_URL + '/functions/v1/self-signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
      body: JSON.stringify({ action: 'request_code', email }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      show('msg-error', esc(data.error || ('تعذّر إرسال الرمز (HTTP ' + res.status + ').')));
      btn.disabled = false; btn.textContent = 'أرسل الرمز';
      return;
    }
    show('msg-success', 'أرسلنا الرمز إلى بريدك. تحقق من صندوق الوارد ومن مجلد الرسائل غير المرغوبة.');
    const codeInput = document.getElementById('suCode');
    if (codeInput) codeInput.focus();

    // منع الضغط المتكرر: عدّاد 60 ثانية قبل إعادة الإرسال
    let left = 60;
    clearInterval(lpCodeTimer);
    btn.textContent = 'إعادة الإرسال بعد ' + left;
    lpCodeTimer = setInterval(() => {
      left -= 1;
      if (left <= 0) {
        clearInterval(lpCodeTimer);
        btn.disabled = false; btn.textContent = 'أرسل الرمز';
      } else {
        btn.textContent = 'إعادة الإرسال بعد ' + left;
      }
    }, 1000);
  } catch (e) {
    show('msg-error', 'تعذّر الاتصال بالخادم. تحقق من الاتصال وحاول مرة أخرى.');
    btn.disabled = false; btn.textContent = 'أرسل الرمز';
  }
}
async function lpDoSignup() {
  const btn = document.getElementById('suBtn');
  const msg = document.getElementById('suMsg');
  const g = id => { const n = document.getElementById(id); return n ? (n.value || '').trim() : ''; };

  const name = g('suName'), email = g('suEmail'), university = g('suUni'), major = g('suMajor');
  const err = t => { msg.innerHTML = '<div class="msg-box msg-error">' + t + '</div>'; };

  if (name.length < 3) return err('اكتب اسمك الكامل (3 أحرف على الأقل).');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return err('البريد الإلكتروني غير صالح.');
  if (!university) return err('اكتب اسم الجامعة أو المعهد.');
  if (!major) return err('اكتب تخصصك.');

  const startDate = lpReadDate('suStart');
  const endDate = lpReadDate('suEnd');
  if (startDate === null) return err('تاريخ البداية غير صحيح — راجع اليوم والشهر.');
  if (endDate === null) return err('تاريخ النهاية غير صحيح — راجع اليوم والشهر.');
  if (startDate && endDate && endDate < startDate) return err('تاريخ النهاية يسبق تاريخ البداية.');

  btn.disabled = true; btn.textContent = 'جارِ الإرسال...'; msg.innerHTML = '';
  try {
    const res = await fetch(SUPABASE_URL + '/functions/v1/self-signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
      body: JSON.stringify({
        action: 'submit',
        full_name: name, email, phone: g('suPhone'), code: g('suCode'),
        university, major,
        study_level: g('suLevel'), gpa: g('suGpa'),
        preferred_start_date: startDate, preferred_end_date: endDate,
        weekly_hours: g('suHours'),
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) return err(esc(data.error || ('تعذّر إرسال الطلب (HTTP ' + res.status + ').')));

    msg.innerHTML =
      '<div class="msg-box msg-success">' +
      '<div style="font-weight:500;margin-bottom:6px">✓ وصلنا طلبك</div>' +
      '<div class="lp-cert-row"><span>رقم الطلب</span><span dir="ltr">' + esc(data.reference || '—') + '</span></div>' +
      '<div style="margin-top:8px">يراجع فريقنا طلبك، وعند القبول نتواصل معك على بريدك لتزويدك ببيانات الدخول. احتفظ برقم الطلب للمراجعة.</div>' +
      '</div>';
    btn.style.display = 'none';
  } catch (e) {
    err('تعذّر الاتصال بالخادم. تحقق من الاتصال وحاول مرة أخرى.');
  } finally {
    btn.disabled = false; btn.textContent = 'إرسال الطلب';
  }
}

// تُعرض الأسماء والمخرج النهائي فقط؛ تفاصيل المهام والحالات خلف الحساب.
async function lpOpenTracks() {
  lpCloseAny();

  if (!el) return;
  el.classList.add('open');
  const body = document.getElementById('lpTracksBody');
  body.innerHTML = '<div style="color:rgba(255,255,255,.5);font-size:14px">جارِ التحميل...</div>';
  const closeBtn = el.querySelector('.lp-close');
  if (closeBtn) setTimeout(() => closeBtn.focus(), 30);
  try {
    const { data, error } = await sb.rpc('public_tracks');
    if (error) throw new Error(error.message);
    const list = data || [];

      body.innerHTML = '<div style="color:rgba(255,255,255,.5);font-size:14px;line-height:1.8">لم تُنشر المسارات بعد.</div>';
      return;
    }

    // تجميع مع الحفاظ على ترتيب sort_order القادم من الخادم
    const groups = [];

      byName[g].push(t);
    });

    body.innerHTML =
      '<p class="lp-tracks-count">' + list.length + ' تخصصاً في ' + groups.length + ' مجموعات</p>' +
      groups.map(g =>
        '<div class="lp-tg">' +
          '<h3 class="lp-tg-title">' + esc(g) + '<span class="lp-tg-n">' + byName[g].length + '</span></h3>' +
          '<div class="lp-tg-list">' +
            byName[g].map(t =>
              '<div class="lp-track">' +
                '<p class="lp-track-name">' + esc(t.name) + '</p>' +
                (t.description ? '<p class="lp-track-out">المخرج النهائي: ' + esc(t.description) + '</p>' : '') +
              '</div>'
            ).join('') +
          '</div>' +
        '</div>'
      ).join('') +
      '<div class="lp-tracks-cta">' +
        '<p>تفاصيل المهام والحالات الاستشارية داخل المنصة. قدّم طلب التحاق للاطلاع على مسارك.</p>' +
        '<button type="button" class="lp-submit" onclick="lpOpenSignup()">قدّم طلب التحاق</button>' +
      '</div>';
  } catch (e) {
    body.innerHTML = '<div class="msg-box msg-error">تعذّر تحميل المسارات. حاول مرة أخرى.</div>';
  }
}

const LP_CERT_LABELS = { completion: 'شهادة إتمام', participation: 'شهادة حضور', excellence: 'شهادة تميّز' };

async function lpDoVerify() {
  const btn = document.getElementById('lpVerifyBtn');
  const msg = document.getElementById('lpVerifyMsg');
  const code = (document.getElementById('lpVerifyCode').value || '').trim();
  if (!code) { msg.innerHTML = '<div class="msg-box msg-error">اكتب رمز التحقق أولاً.</div>'; return; }
  btn.disabled = true; btn.textContent = 'جارِ التحقق...'; msg.innerHTML = '';
  try {
    const { data, error } = await sb.rpc('verify_certificate', { p_code: code });
    if (error) throw new Error(error.message);
    const row = Array.isArray(data) ? data[0] : data;
    if (!row || row.valid !== true) {
      msg.innerHTML = '<div class="msg-box msg-error">لا توجد شهادة بهذا الرمز. تأكد من كتابته كما هو مطبوع على الشهادة.</div>';
    } else if (row.revoked === true) {
      msg.innerHTML = '<div class="msg-box msg-error">هذه الشهادة ملغاة ولم تعد سارية.</div>';
    } else {
      let issued = '—';
      try {
        if (row.issued_at) issued = new Date(row.issued_at).toLocaleDateString('ar-SA-u-ca-gregory', { year: 'numeric', month: 'long', day: 'numeric' });
      } catch (e) {}
      const type = LP_CERT_LABELS[row.certificate_type] || row.certificate_type || '—';
      msg.innerHTML =
        '<div class="msg-box msg-success">' +
        '<div style="font-weight:500;margin-bottom:8px">✓ شهادة سارية وموثّقة</div>' +
        '<div class="lp-cert-row"><span>الاسم</span><span>' + esc(row.trainee_name || '—') + '</span></div>' +
        '<div class="lp-cert-row"><span>النوع</span><span>' + esc(type) + '</span></div>' +
        (row.track_name ? '<div class="lp-cert-row"><span>المسار</span><span>' + esc(row.track_name) + '</span></div>' : '') +
        '<div class="lp-cert-row"><span>تاريخ الإصدار</span><span>' + esc(issued) + '</span></div>' +
        '</div>';
    }
  } catch (e) {
    msg.innerHTML = '<div class="msg-box msg-error">تعذّر الاتصال بالخادم. تحقق من الاتصال وحاول مرة أخرى.</div>';
  } finally {
    btn.disabled = false; btn.textContent = 'تحقّق';
  }
}

function lpOpenLogin() {
  lpCloseAny();
  const el = document.getElementById('lpAuth');
  if (!el) return;
  el.classList.add('open');
  const f = document.getElementById('loginEmail');
  if (f) setTimeout(() => f.focus(), 30);
}

function lpCloseLogin() { lpCloseAny(); }

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginBtn');
  const msgEl = document.getElementById('loginMsg');
  if (!email || !password) {
    msgEl.innerHTML = `<div class="msg-box msg-error">اكتب الإيميل وكلمة المرور.</div>`;
    return;
  }
  btn.disabled = true; btn.textContent = 'جارِ الدخول...';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    btn.disabled = false; btn.textContent = 'تسجيل الدخول';
    msgEl.innerHTML = `<div class="msg-box msg-error">فشل تسجيل الدخول: ${esc(error.message)}</div>`;
    return;
  }
  state.session = data.session;
  await postLogin();
}

async function logout() {
  await sb.auth.signOut();
  Object.assign(state, { session: null, isAdminOrManager: false, isAdmin: false, isStaff: false, myTraineeId: null, myTrainee: null });
  renderLogin();
}

async function postLogin() {
  if (window.__lpStop) { try { window.__lpStop(); } catch (e) {} window.__lpStop = null; }
  document.removeEventListener('keydown', lpEscHandler);
  document.getElementById('app').innerHTML = `<div class="loading">جارِ تجهيز حسابك...</div>`;

  sb.rpc('log_login_event', { p_user_agent: navigator.userAgent }).then(() => {}, () => {});

  const [{ data: isManager }, { data: isStaffRes }, { data: roleName }] = await Promise.all([
    sb.rpc('is_admin_or_manager'),
    sb.rpc('is_staff'),
    sb.rpc('current_role_name'),
  ]);
  state.isAdminOrManager = !!isManager;
  state.isStaff = !!isStaffRes;
  state.isAdmin = roleName === 'admin';

  const { data: taRow } = await sb.from('temp_accounts')
    .select('trainee_id, account_status, trainees(id, full_name, status)')
    .eq('auth_user_id', state.session.user.id)
    .maybeSingle();

  if (taRow) {
    state.myTraineeId = taRow.trainee_id;
    state.myTrainee = taRow.trainees;
  }

  if (state.isStaff) {
    renderShell('staff');
    await renderStaffTab(state.isAdminOrManager ? 'dashboard' : 'applications');
  } else if (state.myTraineeId) {
    renderShell('trainee');
    await checkNdaAndRenderTrainee();
  } else {
    document.getElementById('app').innerHTML = `
      <div class="login-wrap"><div class="login-card"><div class="login-body">
        <div class="msg-box msg-warn">تم تسجيل دخولك بنجاح، لكن حسابك غير مرتبط بأي دور معروف في منصة التدريب (لا موظف ولا متدرب).
        تواصل مع الإدارة لمراجعة حسابك.</div>
        <button class="full secondary" style="margin-top:14px" onclick="logout()">تسجيل خروج</button>
      </div></div></div>`;
  }
}

async function submitEmergencyReport() {

// ترتيب البوابات: الشروط والخصوصية ← تعهد السرية ← اختبار الوعي الأمني.
// الموافقة على الشروط تسبق التعهد لأنها شرط استخدام المنصة نفسها لا شرط رؤية المهام.
async function checkNdaAndRenderTrainee() {
  const { data: pending } = await sb.rpc('pending_policies');
  if (pending && pending.length) {
    await renderPolicyGate(pending);
    return;
  }
  const { data: valid } = await sb.rpc('has_valid_nda_signature');
  if (!valid) {
    await renderNdaGate();
  } else {
    await checkExamGatesAndRenderTrainee();
  }
}

const POLICY_TITLES = { privacy: 'سياسة الخصوصية', terms: 'شروط الاستخدام' };

// كل وثيقة تُعرض بنصها كاملاً، ولا يُفعّل زر الموافقة إلا بعد التمرير إلى آخرها
// وتعليم صندوقها — حتى لا تكون الموافقة نقرة عمياء.
async function renderPolicyGate(pending) {
  setNavVisible(false);
  const main = document.getElementById('mainContent') || document.getElementById('app');
  const blocks = pending.map((p, i) => `
    <div class="policy-block">
      <h3>${esc(POLICY_TITLES[p.policy_type] || p.policy_type)}
        <span class="policy-ver">${esc(p.version_label)}</span></h3>
      <div class="policy-text" id="pol${i}" onscroll="policyScrolled(${i})">${esc(p.full_text)}</div>
      <label class="policy-ack">
        <input type="checkbox" id="polAck${i}" disabled onchange="policyAckChanged()">
        <span id="polAckLbl${i}">اقرأ الوثيقة كاملة لتتمكن من الموافقة</span>
      </label>
    </div>`).join('');

  main.innerHTML = `
    <div class="panel policy-gate">
      <h2>قبل أن تبدأ</h2>
      <p class="panel-note">وافق على الوثيقتين للمتابعة. تُحفظ موافقتك ببصمة نص النسخة التي قرأتها.</p>
      ${blocks}
      <label class="policy-ack">اسمك الكامل للتوثيق
        <input type="text" id="polName" placeholder="الاسم الثلاثي" oninput="policyAckChanged()">
      </label>
      <div id="polMsg"></div>
      <div class="actions-row" style="margin-top:12px">
        <button class="gold" id="polBtn" disabled onclick='submitPolicies(${JSON.stringify(pending.map(p => p.id))})'>
          أوافق وأتابع</button>
        <button class="secondary" onclick="logout()">تسجيل خروج</button>
      </div>
    </div>`;
  window.__polCount = pending.length;
}

function policyScrolled(i) {
  const el = document.getElementById('pol' + i);
  if (!el) return;
  // هامش 24 بكسل يستوعب فروق التقريب بين المتصفحات
  if (el.scrollTop + el.clientHeight < el.scrollHeight - 24) return;
  const box = document.getElementById('polAck' + i);
  const lbl = document.getElementById('polAckLbl' + i);
  if (box && box.disabled) {
    box.disabled = false;
    if (lbl) lbl.textContent = 'قرأتُ الوثيقة وأوافق على ما فيها';
  }
}

function policyAckChanged() {
  const n = window.__polCount || 0;
  let all = true;
  for (let i = 0; i < n; i++) {
    const b = document.getElementById('polAck' + i);
    if (!b || !b.checked) { all = false; break; }
  }
  const name = (document.getElementById('polName') || {}).value || '';
  const btn = document.getElementById('polBtn');
  if (btn) btn.disabled = !(all && name.trim().length >= 3);
}

async function submitPolicies(ids) {
  const btn = document.getElementById('polBtn');
  const msg = document.getElementById('polMsg');
  const name = document.getElementById('polName').value.trim();
  btn.disabled = true; btn.textContent = 'جارِ الحفظ...';
  try {
    const { data: pending } = await sb.rpc('pending_policies');
    const rows = [];
    for (const p of (pending || [])) {
      if (!ids.includes(p.id)) continue;
      rows.push({
        policy_version_id: p.id,
        auth_user_id: state.session.user.id,
        trainee_id: state.myTraineeId || null,
        full_name_entered: name,
        text_sha256: await sha256Hex(p.full_text),
        session_info: { ua: navigator.userAgent.slice(0, 300), at: new Date().toISOString() },
      });
    }
    if (rows.length) {
      const { error } = await sb.from('policy_acceptances').insert(rows);
      if (error) throw new Error(error.message);
    }
    await checkNdaAndRenderTrainee();
  } catch (e) {
    msg.innerHTML = `<div class="msg-box msg-error">${esc(e.message || 'تعذّر حفظ الموافقة.')}</div>`;
    btn.disabled = false; btn.textContent = 'أوافق وأتابع';
  }
}

// بصمة نص الوثيقة تُحسب في المتصفح وتُخزَّن مع الموافقة، فتثبت ما وافق عليه فعلاً
// حتى لو عُدّلت النسخة لاحقاً.
async function sha256Hex(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function checkExamGatesAndRenderTrainee() {
  // ١) أي جلسة اختبار قيد التنفيذ (مفاجئة أو أمنية لم تكتمل) تُعرض فوراً وتحجب باقي الواجهة
  const { data: activeSession } = await sb.from('exam_sessions')
    .select('*').eq('status', 'in_progress').order('created_at', { ascending: false }).limit(1).maybeSingle();
  if (activeSession) {
    await renderExamFlow(activeSession);
    return;
  }

  // ٢) بوابة اختبار الوعي الأمني الإلزامي (مغلقة افتراضياً حتى يفعّلها المالك)
  const { data: gateOn } = await sb.rpc('exam_gate_enabled');
  if (gateOn) {
    const { data: passed } = await sb.rpc('has_passed_mandatory_security_exam');
    if (!passed) {
      await renderExamIntro('security_awareness');
      return;
    }
  }

  setNavVisible(true);
  await renderTraineeTab('tasks');
}

function renderExamIntro(scope) {
  setNavVisible(false);
  const main = document.getElementById('mainContent');
  const title = scope === 'security_awareness' ? 'اختبار الوعي الأمني الإلزامي' : 'اختبار';
  main.innerHTML = `
    <div class="panel">
      <h2>${esc(title)}</h2>
      <div class="msg-box msg-warn">يجب اجتياز هذا الاختبار قبل الوصول لمهامك. الأسئلة تُولَّد حياً وتختبر فهمك الفعلي لتعهد السرية — لا تتوقع أسئلة سهلة أو مكررة.</div>
      <button class="full gold" id="startExamBtn" onclick="startExamFlow('${scope}')">بدء الاختبار</button>
      <div id="examIntroMsg"></div>
    </div>
  `;
}

async function startExamFlow(scope) {
  const btn = document.getElementById('startExamBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'جارِ التحضير...'; }
  try {
    const data = await authedFetch('exam-generate-question', { scope });
    await renderExamQuestion(data);
  } catch (err) {
    const msgEl = document.getElementById('examIntroMsg');
    if (msgEl) msgEl.innerHTML = `<div class="msg-box msg-error">${esc(err.message)}</div>`;
    else alert('تعذّر بدء الاختبار: ' + err.message);
    if (btn) { btn.disabled = false; btn.textContent = 'بدء الاختبار'; }
  }
}

async function renderExamFlow(session) {
  setNavVisible(false);
  const main = document.getElementById('mainContent');
  main.innerHTML = `<div class="loading">جارِ تحميل السؤال...</div>`;
  try {
    const data = await authedFetch('exam-generate-question', { scope: session.scope, exam_session_id: session.id });
    await renderExamQuestion(data);
  } catch (err) {
    main.innerHTML = `<div class="panel"><div class="msg-box msg-error">تعذّر تحميل سؤال الاختبار: ${esc(err.message)}</div></div>`;
  }
}

function renderExamQuestion(data) {
  const main = document.getElementById('mainContent');
  let answerInput = '';
  if (data.question_type === 'mcq' && Array.isArray(data.options)) {
    answerInput = data.options.map((opt, i) => `
      <div class="ack-row"><input type="radio" name="examAnswer" id="examOpt${i}" value="${esc(opt)}"><label style="margin:0" for="examOpt${i}">${esc(opt)}</label></div>
    `).join('');
  } else if (data.question_type === 'true_false') {
    answerInput = `
      <div class="ack-row"><input type="radio" name="examAnswer" id="examOptTrue" value="صح"><label style="margin:0" for="examOptTrue">صح</label></div>
      <div class="ack-row"><input type="radio" name="examAnswer" id="examOptFalse" value="خطأ"><label style="margin:0" for="examOptFalse">خطأ</label></div>
    `;
  } else {
    answerInput = `<textarea id="examShortAnswer" rows="3" placeholder="اكتب إجابتك..."></textarea>`;
  }

  main.innerHTML = `
    <div class="panel">
      <h2>سؤال ${data.question_order} من ${data.questions_total_target}</h2>
      <p style="font-size:13px;color:var(--muted)">مستوى الصعوبة: ${esc(data.difficulty_label || '—')}</p>
      <p style="font-weight:600;font-size:16px">${esc(data.question_text)}</p>
      ${answerInput}
      <div id="examQMsg"></div>
      <button class="full gold" style="margin-top:12px" onclick="submitExamAnswerAction('${data.question_id}', '${data.question_type}')">إرسال الإجابة</button>
    </div>
  `;
}

async function submitExamAnswerAction(questionId, questionType) {
  let answer = '';
  if (questionType === 'short_answer') {
    answer = document.getElementById('examShortAnswer').value.trim();
  } else {
    const checked = document.querySelector('input[name="examAnswer"]:checked');
    answer = checked ? checked.value : '';
  }
  const msgEl = document.getElementById('examQMsg');
  if (!answer) {
    msgEl.innerHTML = `<div class="msg-box msg-error">اختر أو اكتب إجابة قبل الإرسال.</div>`;
    return;
  }
  try {
    const result = await authedFetch('exam-submit-answer', { question_id: questionId, answer });
    const main = document.getElementById('mainContent');
    const resultBox = result.is_correct
      ? `<div class="msg-box" style="background:#eaf6ec;border:1px solid #1e7e34;color:#1e7e34">إجابة صحيحة ✓${result.explanation ? '<br>' + esc(result.explanation) : ''}</div>`
      : `<div class="msg-box msg-error">إجابة غير صحيحة. الإجابة الصحيحة: ${esc(result.correct_answer)}${result.explanation ? '<br>' + esc(result.explanation) : ''}</div>`;

    if (!result.session_complete) {
      main.innerHTML = `<div class="panel">${resultBox}<button class="full gold" style="margin-top:12px" onclick="continueExamFlow()">السؤال التالي</button></div>`;
    } else {
      const passed = result.passed;
      const summary = passed
        ? `<div class="msg-box" style="background:#eaf6ec;border:1px solid #1e7e34;color:#1e7e34">اجتزت الاختبار! النتيجة: ${result.score_percent}% (${result.correct_count}/${result.total_questions})</div>`
        : `<div class="msg-box msg-error">لم تجتز الاختبار هذه المرة. النتيجة: ${result.score_percent}% (${result.correct_count}/${result.total_questions}). سيتم إتاحة محاولة جديدة لاحقاً.</div>`;
      main.innerHTML = `<div class="panel">${resultBox}${summary}<button class="full gold" style="margin-top:12px" onclick="checkExamGatesAndRenderTrainee()">متابعة</button></div>`;
    }
  } catch (err) {
    msgEl.innerHTML = `<div class="msg-box msg-error">${esc(err.message)}</div>`;
  }
}

async function renderNdaGate() {

  if (error || !ndaVersion) {
    main.innerHTML = `<div class="panel"><div class="msg-box msg-error">تعذّر تحميل نص اتفاقية عدم الإفشاء. تواصل مع الإدارة.</div></div>`;

  }

  main.innerHTML = `
    <div class="panel">
      <h2>قبل المتابعة — اتفاقية عدم الإفشاء (NDA)</h2>
      <div class="msg-box msg-warn">يجب توقيع هذه الاتفاقية قبل الوصول لأي جزء آخر من المنصة.</div>
      <div class="msg-box msg-warn" id="ndaScrollHint">مرّر النص كاملاً إلى الأسفل لتفعيل خانات الإقرار.</div>
      <div class="nda-text" id="ndaTextBox">${esc(ndaVersion.full_text)}</div>
      <div class="ack-row"><input type="checkbox" id="ack1" disabled><label style="margin:0" for="ack1">قرأت النص وفهمته بالكامل</label></div>
      <div class="ack-row"><input type="checkbox" id="ack2" disabled><label style="margin:0" for="ack2">ألتزم بسرية كل المعلومات التي سأطّلع عليها</label></div>
      <div class="ack-row"><input type="checkbox" id="ack3" disabled><label style="margin:0" for="ack3">لن أشارك أو أنشر أي معلومة أو مستند دون إذن كتابي</label></div>
      <div class="ack-row"><input type="checkbox" id="ack4" disabled><label style="margin:0" for="ack4">أتحمّل المسؤولية الكاملة عن أي مخالفة لهذه الاتفاقية</label></div>
      <label for="ndaFullName">اكتب اسمك الكامل تأكيداً لتوقيعك</label>
      <input id="ndaFullName" type="text" placeholder="الاسم الكامل">
      <button class="full gold" id="ndaSubmitBtn" disabled onclick="submitNda('${ndaVersion.id}')">توقيع وموافقة (مرّر النص للنهاية أولاً)</button>
      <div id="ndaMsg"></div>
    </div>
  `;
  const box = document.getElementById('ndaTextBox');
  const hint = document.getElementById('ndaScrollHint');
  const submitBtn = document.getElementById('ndaSubmitBtn');
  function checkScrolledToEnd() {
    const reachedEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 4;
    if (reachedEnd) {
      ['ack1','ack2','ack3','ack4'].forEach(id => document.getElementById(id).disabled = false);
      submitBtn.disabled = false;
      submitBtn.textContent = 'توقيع وموافقة';
      hint.textContent = 'تم — يمكنك الآن تعبئة الإقرارات والتوقيع.';
      box.removeEventListener('scroll', checkScrolledToEnd);
    }
  }
  box.addEventListener('scroll', checkScrolledToEnd);
  // نص قصير لا يحتاج تمريراً — فعّل مباشرة إن كان المحتوى بأكمله ظاهراً أصلاً
  requestAnimationFrame(checkScrolledToEnd);
}

async function submitNda(versionId) {
  const ack1 = document.getElementById('ack1').checked;
  const ack2 = document.getElementById('ack2').checked;
  const ack3 = document.getElementById('ack3').checked;
  const ack4 = document.getElementById('ack4').checked;
  const fullName = document.getElementById('ndaFullName').value.trim();
  const msgEl = document.getElementById('ndaMsg');

  if (!ack1 || !ack2 || !ack3 || !ack4) {
    msgEl.innerHTML = `<div class="msg-box msg-error">يجب الموافقة على جميع البنود الأربعة.</div>`;
    return;
  }
  if (!fullName) {
    msgEl.innerHTML = `<div class="msg-box msg-error">اكتب اسمك الكامل.</div>`;
    return;
  }

  const { data: signResult, error } = await sb.rpc('sign_nda', {
    p_full_name_entered: fullName,
    p_ack_read_understood: ack1,
    p_ack_confidentiality: ack2,
    p_ack_no_share_publish: ack3,
    p_ack_own_responsibility: ack4,
    p_session_info: { user_agent: navigator.userAgent, signed_from: 'web' },
  });

  if (error) {
    msgEl.innerHTML = `<div class="msg-box msg-error">فشل التوقيع: ${esc(error.message)}</div>`;
    return;
  }

  const signatureId = Array.isArray(signResult) ? signResult[0]?.signature_id : signResult?.signature_id;
  if (signatureId) {
    state.myNdaSignatureId = signatureId;
  }

  await checkExamGatesAndRenderTrainee();
}

function renderTasksTable(tasks, mine) {
  if (!tasks.length) return `<table><tr><td class="empty-row">لا توجد مهام بعد</td></tr></table>`;
  const rows = tasks.map(t => `
    <tr>
      <td>${esc(t.title)}</td>
      <td>${fmtDate(t.due_date)}</td>
      <td>${badge(t.status)}</td>
      <td>
        ${mine && ['assigned', 'in_progress', 'needs_revision'].includes(t.status)
          ? `<button class="small gold" onclick="openSubmitTaskModal('${t.id}', '${esc(t.title).replace(/'/g, "\\'")}')">تسليم</button>`
          : ''}
      </td>
    </tr>
  `).join('');
  return `<table><thead><tr><th>العنوان</th><th>الموعد النهائي</th><th>الحالة</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;

function renderCertificatesTable(certs, isStaffView) {
  if (!certs.length) return `<table><tr><td class="empty-row">لا توجد شهادات بعد</td></tr></table>`;
  const rows = certs.map(c => `
    <tr>
      <td>${statusLabel(c.certificate_type)}</td>
      <td>${fmtDate(c.issued_at)}</td>
      <td>${c.revoked ? badge('revoked') : badge('active')}</td>

          : ''}

async function downloadCertificate(certId) {
  try {
    const data = await authedFetch('certificate-pdf', { certificate_id: certId });
    window.open(data.download_url, '_blank');
  } catch (err) {
    alert('تعذّر تحميل الشهادة: ' + err.message);
  }
}

async function downloadNdaPdf(signatureId, btnEl) {
  const btn = btnEl || null;
  const originalText = btn ? btn.textContent : null;
  if (btn) { btn.disabled = true; btn.textContent = 'جارِ التحضير...'; }
  try {
    const data = await authedFetch('nda-pdf', { nda_signature_id: signatureId });
    window.open(data.download_url, '_blank');
  } catch (err) {
    alert('تعذّر تحميل نسخة التعهد الموقّع: ' + err.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = originalText; }
  }
}

async function changeRole(sel) {
  const msg = document.getElementById('roleMsg');
  const uid = sel.dataset.uid;
  const prev = sel.dataset.prev || '';
  const val = sel.value || null;
  sel.disabled = true;
  try {
    const { data, error } = await sb.rpc('set_user_role', { p_user_id: uid, p_role: val });
    if (error) throw new Error(error.message);
    const row = Array.isArray(data) ? data[0] : data;
    sel.dataset.prev = sel.value;
    msg.innerHTML = `<div class="msg-box msg-success">حُفظ دور ${esc(row?.full_name || 'الحساب')}: ${esc(val ? ROLE_LABELS[val] : 'بلا دور')}</div>`;
  } catch (e) {
    sel.value = prev;
    msg.innerHTML = `<div class="msg-box msg-error">${esc(e.message)}</div>`;
  } finally {
    sel.disabled = false;
  }
}

async function addHours() {
  const msg = document.getElementById('whMsg');
  const g = id => (document.getElementById(id).value || '').trim();
  const trainee = g('whTrainee'), date = g('whDate'), hrs = parseFloat(g('whHours'));
  const err = t => { msg.innerHTML = `<div class="msg-box msg-error">${esc(t)}</div>`; };

  if (!trainee) return err('اختر المتدرب.');
  if (!date) return err('اختر التاريخ.');
  if (!Number.isFinite(hrs) || hrs <= 0 || hrs > 24) return err('الساعات يجب أن تكون بين 0.5 و24.');

  const { error } = await sb.from('work_hours').upsert({
    trainee_id: trainee, work_date: date, hours: hrs, note: g('whNote') || null,

// ===== قوائم مرجعية (جامعات/تخصصات/أقسام) مع خيار "إضافة جديد" =====
// تُستخدم في نموذج إضافة الطلب اليدوي وشاشة قبول الطلب. القوائم تبدأ فارغة ويضيف
// إليها الموظفون تدريجياً؛ القيمة النهائية المُرسَلة تبقى نصاً حراً (بدون قيد مفتاح أجنبي)
// حفاظاً على توافقها مع الأعمدة الحالية دون أي تعديل على البيانات القديمة.
async function fetchLookupOptions(tableName) {
  const { data, error } = await sb.from(tableName).select('id, name').order('name');
  if (error) { console.error(`تعذر تحميل قائمة ${tableName}:`, error.message); return []; }
  return data || [];
}

function lookupFieldHtml(fieldId, labelText, options) {
  const opts = options.map(o => `<option value="${esc(o.name)}">${esc(o.name)}</option>`).join('');
  return `
    <label>${labelText}</label>
    <select id="${fieldId}_select" onchange="onLookupSelectChange('${fieldId}')">
      <option value="">— اختر —</option>
      ${opts}
      <option value="__new__">+ إضافة جديد...</option>
    </select>
    <input id="${fieldId}_new" type="text" placeholder="اكتب الاسم الجديد" style="display:none;margin-top:6px">
  `;
}

function onLookupSelectChange(fieldId) {
  const sel = document.getElementById(`${fieldId}_select`);
  const newInput = document.getElementById(`${fieldId}_new`);
  if (!sel || !newInput) return;
  if (sel.value === '__new__') {
    newInput.style.display = '';
    newInput.focus();
  } else {
    newInput.style.display = 'none';
    newInput.value = '';
  }
}

// يُرجع القيمة النصية النهائية (موجودة أو مُضافة حديثاً). عند إضافة قيمة جديدة، يتحقق أولاً
// من عدم وجود تطابق شبه مطابق (case-insensitive) قبل الإدراج لتفادي تكرار قريب الشبه.
async function resolveLookupValue(fieldId, tableName, required) {
  const sel = document.getElementById(`${fieldId}_select`);
  const newInput = document.getElementById(`${fieldId}_new`);
  if (sel.value === '__new__') {
    const value = (newInput.value || '').trim();
    if (!value) {
      if (required) throw new Error('يرجى إدخال القيمة الجديدة.');
      return null;
    }
    const { data: existing } = await sb.from(tableName).select('id, name').ilike('name', value).maybeSingle();
    if (existing) return existing.name;
    const { error: insErr } = await sb.from(tableName).insert({ name: value });
    if (insErr && insErr.code !== '23505') throw new Error(insErr.message);
    return value;
  }
  const value = sel.value;
  if (!value) {
    if (required) throw new Error('هذا الحقل مطلوب.');
    return null;
  }
  return value;
}

async function submitNewApplication() {
  const full_name = document.getElementById('napFullName').value.trim();
  const email = document.getElementById('napEmail').value.trim();

  if (!full_name || !email) { msgEl.innerHTML = `<div class="msg-box msg-error">الاسم والإيميل مطلوبان.</div>`; return; }

  let university, major;
  try {
    university = await resolveLookupValue('napUniversity', 'universities', false);
    major = await resolveLookupValue('napMajor', 'majors', false);
  } catch (e) {
    msgEl.innerHTML = `<div class="msg-box msg-error">${esc(e.message)}</div>`;
    return;
  }

  const { error } = await sb.rpc('submit_application_manual', {
    p_full_name: full_name, p_email: email,
    p_national_id: document.getElementById('napNationalId').value.trim() || null,
    p_phone: document.getElementById('napPhone').value.trim() || null,
    p_university: university,
    p_major: major,
  });
  if (error) { msgEl.innerHTML = `<div class="msg-box msg-error">${esc(error.message)}</div>`; return; }
  closeModal();
  await renderStaffTab('applications');
}

async function saveTrainer(id) {
  const msg = document.getElementById('trMsg');

  if (!name) { msg.innerHTML = `<div class="msg-box msg-error">الاسم الكامل مطلوب.</div>`; return; }

  const payload = {
    full_name: name,
    title: document.getElementById('trTitle').value.trim() || null,

    bio: document.getElementById('trBio').value.trim() || null,

function copyVerifyLink(code, btn) {
  if (!code) { alert('لا يوجد رمز تحقق لهذه الشهادة.'); return; }
  const url = location.origin + location.pathname + '?verify=' + encodeURIComponent(code);
  const done = () => {
    if (!btn) return;
    const t = btn.textContent; btn.textContent = 'تم النسخ ✓';
    setTimeout(() => { btn.textContent = t; }, 1600);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done, () => prompt('انسخ الرابط:', url));
  } else {
    prompt('انسخ الرابط:', url);
  }
}

async function createTempAccountAction(traineeId) {
  const starts = document.getElementById('taStart').value;
  const ends = document.getElementById('taEnd').value;
  const username = document.getElementById('taUsername').value.trim();
  const msgEl = document.getElementById('taMsg');
  if (!starts || !ends) { msgEl.innerHTML = `<div class="msg-box msg-error">التواريخ مطلوبة.</div>`; return; }
  try {
    const payload = { trainee_id: traineeId, starts_at: starts, ends_at: ends };
    if (username) payload.username = username;
    const data = await authedFetch('create-temp-account', payload);
    // الدخول بالبريد لا باسم المستخدم — signInWithPassword يقبل البريد فقط.
    const loginEmail = data.login_email || '';
    const credsText = [
      'رابط الدخول: https://training.madarej.sa',
      'البريد الإلكتروني: ' + loginEmail,
      'كلمة المرور المؤقتة: ' + data.temporary_password,
    ].join('\n');

    msgEl.innerHTML = `
      <div class="credential-box">
        <b>تم إنشاء الحساب. انسخ هذه البيانات الآن — لن تظهر مرة أخرى.</b>
        <div class="cred-row"><span>رابط الدخول</span><code dir="ltr">training.madarej.sa</code></div>
        <div class="cred-row"><span>البريد الإلكتروني</span><code dir="ltr">${esc(loginEmail)}</code></div>
        <div class="cred-row"><span>كلمة المرور المؤقتة</span><code dir="ltr">${esc(data.temporary_password)}</code></div>
        <div class="cred-note">يدخل المتدرب بالبريد وكلمة المرور. اسم المستخدم
          <code dir="ltr">${esc(data.username || '')}</code> معرّف داخلي للعرض فقط ولا يُستخدم في الدخول.</div>
        <div class="actions-row" style="margin-top:10px">
          <button class="small gold" id="copyCredsBtn">نسخ بيانات الدخول</button>
          <button class="small secondary" id="doneCredsBtn">سلّمتها — إغلاق</button>
        </div>
      </div>`;

    document.getElementById('copyCredsBtn').addEventListener('click', async () => {
      const b = document.getElementById('copyCredsBtn');
      try {
        await navigator.clipboard.writeText(credsText);
        b.textContent = 'تم النسخ ✓';
        setTimeout(() => { b.textContent = 'نسخ بيانات الدخول'; }, 2000);
      } catch { alert('تعذّر النسخ التلقائي — انسخ النص يدوياً من الصندوق.'); }
    });

    // لا اختفاء تلقائي: الصندوق يبقى حتى يؤكّد الموظف أنه سلّم البيانات.
    document.getElementById('doneCredsBtn').addEventListener('click', () => {
      if (confirm('هل سلّمت بيانات الدخول للمتدرب؟ لن تظهر كلمة المرور مرة أخرى.')) {
        viewTraineeDetail(traineeId);
      }
    });
  } catch (err) {
    msgEl.innerHTML = `<div class="msg-box msg-error">${esc(err.message)}</div>`;
  }
}

// يعرض الشروط قبل الإصدار: الموظف يرى *لماذا* لا يستحق، لا مجرد رفض.
async function loadCertEligibility(traineeId) {
  const box = document.getElementById('icChecks');
  const type = document.getElementById('icType').value;
  box.innerHTML = '<div class="loading">جارِ فحص الاستحقاق...</div>';
  const { data, error } = await sb.rpc('certificate_eligibility',
    { p_trainee_id: traineeId, p_certificate_type: type });
  if (error) { box.innerHTML = `<div class="msg-box msg-error">${esc(error.message)}</div>`; return; }

  const checks = (data && data.checks) || [];
  const rows = checks.map(c => `
    <div class="cert-check ${c.pass ? 'ok' : 'no'}">
      <span class="cc-mark">${c.pass ? '✓' : '✕'}</span>
      <span class="cc-label">${esc(c.label)}</span>
      <span class="cc-actual">${esc(String(c.actual))}</span>
    </div>`).join('') || '<div class="panel-note">لا شروط على هذا النوع.</div>';

  const ok = !!(data && data.eligible);
  box.innerHTML = `
    <div class="msg-box ${ok ? 'msg-success' : 'msg-warn'}" style="margin-bottom:8px">
      ${ok ? 'مستحق — كل الشروط مكتملة' : 'غير مستحق — شروط ناقصة'}</div>
    <div class="cert-checks">${rows}</div>`;

  const w = document.getElementById('icOverrideWrap');
  if (w) w.style.display = ok ? 'none' : '';
  const btn = document.getElementById('icBtn');
  if (btn) btn.textContent = ok ? 'إصدار' : 'إصدار استثناءً';
}

async function issueCertAction(traineeId) {
  const type = document.getElementById('icType').value;
  const msgEl = document.getElementById('icMsg');
  const btn = document.getElementById('icBtn');
  const ov = document.getElementById('icOverride');
  const reason = ov && ov.offsetParent !== null ? (ov.value || '').trim() : '';

  btn.disabled = true;
  const { data: certId, error } = await sb.rpc('issue_certificate', {
    p_trainee_id: traineeId, p_certificate_type: type,
    p_override_reason: reason || null,
  });
  if (error) {
    msgEl.innerHTML = `<div class="msg-box msg-error">${esc(error.message)}</div>`;
    btn.disabled = false;
    return;
  }
  try { await authedFetch('certificate-pdf', { certificate_id: certId }); }
  catch (e) { /* توليد PDF يُعاد لاحقاً من زر التحميل — لا يُفشل الإصدار */ }
  closeModal();
  await viewTraineeDetail(traineeId);
}

async function revokeCertAction(certId) {
  const msg = document.getElementById('rcMsg');
  const btn = document.getElementById('rcBtn');
  const reason = (document.getElementById('rcReason').value || '').trim();
  if (reason.length < 10) {
    msg.innerHTML = '<div class="msg-box msg-error">اكتب سبباً مفصلاً (10 أحرف فأكثر).</div>';
    return;
  }
  btn.disabled = true;
  const { error } = await sb.rpc('revoke_certificate', { p_certificate_id: certId, p_reason: reason });
  if (error) {
    msg.innerHTML = `<div class="msg-box msg-error">${esc(error.message)}</div>`;
    btn.disabled = false; return;
  }
  closeModal();
  await renderStaffTab(state.activeStaffTab || 'certificates');
}
