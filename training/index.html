<style>
  :root {
    --navy: #0B2545;
    --navy-light: #16407a;
    --navy-lighter: #1e5399;
    --gold: #B8860A;
    --gold-light: #e0c15a;
    --bg: #f4f6f9;
    --card: #ffffff;
    --border: #e2e6ec;
    --text: #1a1f2b;
    --muted: #6b7385;
    --danger: #c0392b;
    --danger-bg: #fdecea;
    --success: #1e7e34;
    --success-bg: #eaf6ec;
    --warn: #8a6d00;
    --warn-bg: #fff8e1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Tahoma', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  #app { min-height: 100vh; display: flex; flex-direction: column; }

  /* ===== شاشة الدخول ===== */
  .login-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card {
    background: var(--card); width: 100%; max-width: 420px; border-radius: 14px;
    box-shadow: 0 8px 32px rgba(11,37,69,0.15); overflow: hidden;
  }
  .login-header {
    background: linear-gradient(135deg, var(--navy), var(--navy-lighter));
    color: #fff; padding: 32px 28px 24px; text-align: center; border-bottom: 4px solid var(--gold);
  }
  .login-header h1 { margin: 0 0 4px; font-size: 22px; }
  .login-header p { margin: 0; font-size: 13px; opacity: 0.8; }
  .login-body { padding: 28px; }

  label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: var(--navy); }
  input, select, textarea {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px;
    font-size: 14px; margin-bottom: 14px; font-family: inherit; background: #fff; color: var(--text);
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }
  textarea { min-height: 80px; resize: vertical; }

  button {
    padding: 10px 18px; background: var(--navy); color: #fff; border: none; border-radius: 8px;
    font-size: 14px; font-weight: bold; cursor: pointer; transition: background 0.15s; font-family: inherit;
  }
  button:hover:not(:disabled) { background: var(--navy-lighter); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  button.full { width: 100%; }
  button.secondary { background: #fff; color: var(--navy); border: 1.5px solid var(--navy); }
  button.secondary:hover:not(:disabled) { background: var(--bg); }
  button.gold { background: var(--gold); color: #1a1a1a; }
  button.gold:hover:not(:disabled) { background: var(--gold-light); }
  button.danger { background: var(--danger); }
  button.danger:hover:not(:disabled) { background: #a53125; }
  button.small { padding: 6px 12px; font-size: 12px; }

  .msg-box { padding: 12px 14px; border-radius: 8px; font-size: 13px; margin-top: 12px; white-space: pre-wrap; word-break: break-word; }
  .msg-error { background: var(--danger-bg); border: 1px solid var(--danger); color: var(--danger); }
  .msg-success { background: var(--success-bg); border: 1px solid var(--success); color: var(--success); }
  .msg-warn { background: var(--warn-bg); border: 1px solid var(--gold-light); color: var(--warn); }

  /* ===== الشِل بعد الدخول ===== */
  .topbar {
    background: var(--navy); color: #fff; padding: 14px 24px; display: flex;
    align-items: center; justify-content: space-between; border-bottom: 3px solid var(--gold);
  }
  .topbar .brand { font-weight: bold; font-size: 16px; }
  .topbar .brand span { color: var(--gold-light); }
  .topbar .who { font-size: 13px; opacity: 0.85; margin-inline-end: 14px; }
  .topbar-right { display: flex; align-items: center; }

  .tabs { display: flex; gap: 6px; background: #fff; padding: 10px 24px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .tab-btn {
    background: transparent; color: var(--muted); border: none; border-bottom: 3px solid transparent;
    border-radius: 0; padding: 10px 16px; font-weight: bold; font-size: 14px;
  }
  .tab-btn.active { color: var(--navy); border-bottom-color: var(--gold); }
  .tab-btn:hover:not(.active) { color: var(--navy); background: transparent; }

  .main { flex: 1; padding: 24px; max-width: 1100px; width: 100%; margin: 0 auto; }
  .panel { background: var(--card); border-radius: 12px; border: 1px solid var(--border); padding: 22px; margin-bottom: 18px; }
  .panel h2 { margin: 0 0 16px; font-size: 17px; color: var(--navy); }
  .panel h3 { margin: 18px 0 10px; font-size: 14px; color: var(--navy); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px; text-align: right; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { color: var(--navy); background: var(--bg); font-size: 12px; }
  tr:hover td { background: #fafbfc; }
  .empty-row { text-align: center; color: var(--muted); padding: 24px !important; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
  .badge-pending { background: var(--warn-bg); color: var(--warn); }
  .badge-active, .badge-approved, .badge-accepted { background: var(--success-bg); color: var(--success); }
  .badge-rejected, .badge-revoked { background: var(--danger-bg); color: var(--danger); }
  .badge-archived, .badge-suspended { background: #eee; color: #666; }
  .badge-under_review, .badge-needs_more_info, .badge-in_progress, .badge-submitted, .badge-needs_revision { background: #eaf1fb; color: var(--navy-lighter); }

  .modal-overlay {

    align-items: center; justify-content: center; z-index: 50; padding: 16px;
  }

  .modal-box { background: #fff; border-radius: 12px; max-width: 480px; width: 100%; padding: 24px; max-height: 90vh; overflow-y: auto; }
  .modal-box h3 { margin-top: 0; color: var(--navy); }
  .modal-actions { display: flex; gap: 10px; margin-top: 10px; }

  .nda-text { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; max-height: 320px; overflow-y: auto; font-size: 13px; line-height: 2; white-space: pre-wrap; margin-bottom: 16px; }
  .ack-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; font-size: 13px; }
  .ack-row input { width: auto; margin: 3px 0 0; flex-shrink: 0; }

  .credential-box { background: var(--warn-bg); border: 1px solid var(--gold-light); border-radius: 8px; padding: 14px; font-size: 13px; margin-top: 12px; }
  .credential-box code { background: #fff; border: 1px solid var(--gold-light); padding: 2px 8px; border-radius: 5px; direction: ltr; display: inline-block; font-family: 'Consolas', monospace; }

  .loading { text-align: center; padding: 40px; color: var(--muted); }
  .actions-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .hidden { display: none !important; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .split { grid-template-columns: 1fr; } .main { padding: 14px; } }

  .lp { position: relative; height: 100svh; min-height: 100svh; background: #131A22; color: #fff;
        font-family: 'IBM Plex Sans Arabic', Tahoma, sans-serif; overflow: hidden;
        display: flex; flex-direction: column; justify-content: space-between; -webkit-font-smoothing: antialiased; }
  .lp a { color: inherit; text-decoration: none; }
  .lp-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .lp-headwrap { position: absolute; z-index: 50; top: 0; right: 0; width: 100%; padding-top: 56px; pointer-events: none; }
  .lp-header { display: flex; align-items: center; justify-content: space-between;
               max-width: 1440px; margin-inline: auto; padding-inline: 48px; pointer-events: auto; }
  .lp-logo { display: block; flex: none; }
  .lp-logo img { width: 76px; height: 76px; border-radius: 9999px; display: block; }
  .lp-nav { position: absolute; right: 50%; transform: translateX(50%); display: flex; align-items: center;
            gap: 40px; font-size: 14px; font-weight: 400; letter-spacing: .06em; }
  .lp-nav a { color: rgba(255,255,255,.6); transition: color .15s ease-out; }
  .lp-nav a:hover { color: #fff; }
  .lp-signin { /* هدف لمس */ font-size: 14px; font-weight: 500; letter-spacing: .06em; color: #9FB6CE;

  .lp-badge .c { position: absolute; width: 12px; height: 2px; background: #38465A; }

  .lp-badge .c3 { bottom: 1.5px; left: 1.5px; transform: rotate(45deg) translateX(-50%); }

  .lp-cta .c { position: absolute; width: 32px; height: 2px; background: #9FB6CE; }
  .lp-cta .c1 { top: 6.5px; left: 6.5px; transform: rotate(-45deg) translateX(-50%); transform-origin: top; }
  .lp-cta .c2 { bottom: 6.5px; right: 6.5px; transform: rotate(-45deg) translateX(50%); }

  /* لوحة الدخول فوق الهيرو */
  .lp-auth { position: absolute; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center;

  .lp-authcard { position: relative; width: 100%; max-width: 420px; background: rgba(19,26,34,.96);

  .lp-authcard .c { position: absolute; width: 32px; height: 2px; background: #9FB6CE; }
  .lp-authcard .c1 { top: 6.5px; left: 6.5px; transform: rotate(-45deg) translateX(-50%); transform-origin: top; }
  .lp-authcard .c2 { bottom: 6.5px; right: 6.5px; transform: rotate(-45deg) translateX(50%); }
  .lp-authcard h2 { margin: 0 0 6px; font-size: 24px; font-weight: 300; letter-spacing: -.01em; color: #fff; }
  .lp-authcard .lp-authsub { margin: 0 0 26px; font-size: 14px; font-weight: 300; color: rgba(255,255,255,.55); }
  .lp-authcard label { display: block; font-size: 13px; font-weight: 400; letter-spacing: .04em;
                       margin-bottom: 8px; color: rgba(255,255,255,.6); }
  .lp-authcard input { width: 100%; padding: 12px 14px; margin-bottom: 18px; background: rgba(44,58,75,.45);
                       border: 1px solid #38465A; border-radius: 0; color: #fff; font-size: 14px;
                       font-family: 'IBM Plex Sans Arabic', sans-serif; transition: border-color .15s ease-out; }
  .lp-authcard input::placeholder { color: rgba(255,255,255,.3); }
  .lp-authcard input:focus { outline: none; border-color: #9FB6CE; }
  .lp-submit { width: 100%; height: 56px; margin-top: 6px; background: #131A22; color: #fff;
               border: 1px solid #9FB6CE; border-radius: 0; cursor: pointer;
               font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 15px; font-weight: 500; letter-spacing: .04em;
               box-shadow: inset 0 0 40px 0 rgba(96,124,155,.85); transition: all .3s ease-out;
               clip-path: polygon(12px 0,calc(100% - 12px) 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 calc(100% - 12px),0 12px); }
  .lp-submit:hover:not(:disabled) { background: #131A22; box-shadow: inset 0 0 40px 0 rgba(126,157,190,.95); }
  .lp-submit:disabled { opacity: .55; cursor: not-allowed; }
  .lp-close { position: absolute; top: 8px; left: 10px; background: none; border: none; color: rgba(255,255,255,.45);
              font-size: 22px; line-height: 1; cursor: pointer; font-family: inherit;
              width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
  .lp-close:hover:not(:disabled) { background: none; color: #fff; }
  .lp .msg-box { border-radius: 0; font-size: 13px; }
  .lp .msg-error { background: rgba(192,57,43,.14); border: 1px solid rgba(192,57,43,.55); color: #ffb4ab; }
  .lp .msg-success { background: rgba(30,126,52,.16); border: 1px solid rgba(46,160,67,.5); color: #8ee5a1; }
  .lp-code { direction: ltr; text-align: left; letter-spacing: .08em; text-transform: uppercase; }
  .lp-cert-row { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }

  @media (max-width: 900px) {

const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1cXFrZmd3eWJobWlweWZsY2ZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2OTkzNzQsImV4cCI6MjEwMTI3NTM3NH0.HSCi8np0BuhqYAfl7ps-bWXntgu-PEs0x5uZPm-Bfw0";

const sb = window.supabase.createClient(SUPABASE_URL, ANON_KEY);

const state = {
  session: null,

  myTrainee: null,
  activeStaffTab: 'applications',

const STATUS_LABELS = {
  pending: 'قيد الانتظار', under_review: 'قيد المراجعة', needs_more_info: 'يحتاج معلومات إضافية',
  accepted: 'مقبول', rejected: 'مرفوض',

  assigned: 'مُكلّف', in_progress: 'قيد التنفيذ', submitted: 'تم التسليم', approved: 'مقبولة', needs_revision: 'تحتاج تعديل',
  completion: 'إتمام', excellence: 'تفوق', participation: 'مشاركة',
};
function statusLabel(s) { return STATUS_LABELS[s] || s || '—'; }
function badge(s) { return `<span class="badge badge-${s}">${statusLabel(s)}</span>`; }
function esc(str) {
  const d = document.createElement('div'); d.textContent = str ?? ''; return d.innerHTML;
}
function fmtDate(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('ar-SA'); }

function openModal(html) {
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('modalBox').innerHTML = '';
}
document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'modalOverlay') closeModal();
});

async function authedFetch(path, body) {
  const { data: sessionData } = await sb.auth.getSession();
  const token = sessionData?.session?.access_token;
  const res = await fetch(`${SUPABASE_URL}/functions/v1/${path}`, {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${token}`, 'apikey': ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `خطأ HTTP ${res.status}`);
  return data;
}

  const { data } = await sb.auth.getSession();

    state.session = data.session;
    await postLogin();

}

        </div>

      <div class="lp-auth" id="lpVerify" role="dialog" aria-modal="true" aria-labelledby="lpVerifyTitle" onclick="lpBackdrop(event)">
        <div class="lp-authcard">
          <span class="c c1"></span><span class="c c2"></span>
          <button type="button" class="lp-close" onclick="lpCloseVerify()" aria-label="إغلاق">&times;</button>
          <h2 id="lpVerifyTitle">التحقق من شهادة</h2>

          <label for="lpVerifyCode">رمز التحقق</label>

          <div id="lpVerifyMsg"></div>
        </div>
      </div>
    </div>
  `;

  const cv = document.getElementById('lpCanvas');
  if (cv && window.SkalParticles) {
    try { window.__lpStop = window.SkalParticles.start(cv); } catch (e) {}
  }

  document.getElementById('loginPassword').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
  document.getElementById('lpVerifyCode').addEventListener('keydown', (e) => { if (e.key === 'Enter') lpDoVerify(); });
  document.addEventListener('keydown', lpEscHandler);
  if (errorMsg) lpOpenLogin();
}

function lpEscHandler(e) {
  if (e.key === 'Escape') { lpCloseAny(); return; }
  if (e.key !== 'Tab') return;
  // حصر التركيز داخل أي نافذة مفتوحة (الدخول أو التحقق)
  const panel = document.querySelector('.lp-auth.open');
  if (!panel) return;
  const f = [...panel.querySelectorAll('input, button')].filter(el => !el.disabled && el.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

function lpBackdrop(e) {
  if (e.target && e.target.classList && e.target.classList.contains('lp-auth')) lpCloseAny();
}

function lpCloseAny() {
  const open = document.querySelector('.lp-auth.open');
  if (!open) return;
  open.classList.remove('open');
  const back = document.querySelector('.lp-signin');
  if (back) back.focus();
}

function lpOpenVerify() {
  lpCloseAny();
  const el = document.getElementById('lpVerify');
  if (!el) return;
  const msg = document.getElementById('lpVerifyMsg');
  if (msg) msg.innerHTML = '';
  el.classList.add('open');
  const f = document.getElementById('lpVerifyCode');
  if (f) setTimeout(() => f.focus(), 30);
}

function lpCloseVerify() { lpCloseAny(); }

const LP_CERT_LABELS = { completion: 'شهادة إتمام', participation: 'شهادة حضور', excellence: 'شهادة تميّز' };

async function lpDoVerify() {
  const btn = document.getElementById('lpVerifyBtn');
  const msg = document.getElementById('lpVerifyMsg');
  const code = (document.getElementById('lpVerifyCode').value || '').trim();
  if (!code) { msg.innerHTML = '<div class="msg-box msg-error">اكتب رمز التحقق أولاً.</div>'; return; }
  btn.disabled = true; btn.textContent = 'جارِ التحقق...'; msg.innerHTML = '';
  try {
    const { data, error } = await sb.rpc('verify_certificate', { p_code: code });
    if (error) throw new Error(error.message);
    const row = Array.isArray(data) ? data[0] : data;
    if (!row || row.valid !== true) {
      msg.innerHTML = '<div class="msg-box msg-error">لا توجد شهادة بهذا الرمز. تأكد من كتابته كما هو مطبوع على الشهادة.</div>';
    } else if (row.revoked === true) {
      msg.innerHTML = '<div class="msg-box msg-error">هذه الشهادة ملغاة ولم تعد سارية.</div>';
    } else {
      let issued = '—';
      try {
        if (row.issued_at) issued = new Date(row.issued_at).toLocaleDateString('ar-SA-u-ca-gregory', { year: 'numeric', month: 'long', day: 'numeric' });
      } catch (e) {}
      const type = LP_CERT_LABELS[row.certificate_type] || row.certificate_type || '—';
      msg.innerHTML =
        '<div class="msg-box msg-success">' +
        '<div style="font-weight:500;margin-bottom:8px">✓ شهادة سارية وموثّقة</div>' +
        '<div class="lp-cert-row"><span>الاسم</span><span>' + esc(row.trainee_name || '—') + '</span></div>' +
        '<div class="lp-cert-row"><span>النوع</span><span>' + esc(type) + '</span></div>' +
        (row.track_name ? '<div class="lp-cert-row"><span>المسار</span><span>' + esc(row.track_name) + '</span></div>' : '') +
        '<div class="lp-cert-row"><span>تاريخ الإصدار</span><span>' + esc(issued) + '</span></div>' +
        '</div>';
    }
  } catch (e) {
    msg.innerHTML = '<div class="msg-box msg-error">تعذّر الاتصال بالخادم. تحقق من الاتصال وحاول مرة أخرى.</div>';
  } finally {
    btn.disabled = false; btn.textContent = 'تحقّق';
  }
}

function lpOpenLogin() {

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginBtn');
  const msgEl = document.getElementById('loginMsg');
  if (!email || !password) {
    msgEl.innerHTML = `<div class="msg-box msg-error">اكتب الإيميل وكلمة المرور.</div>`;
    return;
  }
  btn.disabled = true; btn.textContent = 'جارِ الدخول...';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    btn.disabled = false; btn.textContent = 'تسجيل الدخول';
    msgEl.innerHTML = `<div class="msg-box msg-error">فشل تسجيل الدخول: ${esc(error.message)}</div>`;
    return;
  }
  state.session = data.session;
  await postLogin();
}

async function logout() {
  await sb.auth.signOut();
  Object.assign(state, { session: null, isAdminOrManager: false, isAdmin: false, isStaff: false, myTraineeId: null, myTrainee: null });
  renderLogin();
}

async function postLogin() {
  if (window.__lpStop) { try { window.__lpStop(); } catch (e) {} window.__lpStop = null; }
  document.removeEventListener('keydown', lpEscHandler);
  document.getElementById('app').innerHTML = `<div class="loading">جارِ تجهيز حسابك...</div>`;

  sb.rpc('log_login_event', { p_user_agent: navigator.userAgent }).then(() => {}, () => {});

  const [{ data: isManager }, { data: isStaffRes }, { data: roleName }] = await Promise.all([
    sb.rpc('is_admin_or_manager'),
    sb.rpc('is_staff'),
    sb.rpc('current_role_name'),
  ]);
  state.isAdminOrManager = !!isManager;
  state.isStaff = !!isStaffRes;
  state.isAdmin = roleName === 'admin';

  const { data: taRow } = await sb.from('temp_accounts')
    .select('trainee_id, account_status, trainees(id, full_name, status)')
    .eq('auth_user_id', state.session.user.id)
    .maybeSingle();

  if (taRow) {
    state.myTraineeId = taRow.trainee_id;
    state.myTrainee = taRow.trainees;
  }

  if (state.isStaff) {
    renderShell('staff');
    await renderStaffTab('applications');
  } else if (state.myTraineeId) {
    renderShell('trainee');
    await checkNdaAndRenderTrainee();
  } else {
    document.getElementById('app').innerHTML = `
      <div class="login-wrap"><div class="login-card"><div class="login-body">
        <div class="msg-box msg-warn">تم تسجيل دخولك بنجاح، لكن حسابك غير مرتبط بأي دور معروف في منصة التدريب (لا موظف ولا متدرب).
        تواصل مع الإدارة لمراجعة حسابك.</div>
        <button class="full secondary" style="margin-top:14px" onclick="logout()">تسجيل خروج</button>
      </div></div></div>`;
  }
}

async function checkExamGatesAndRenderTrainee() {
  // ١) أي جلسة اختبار قيد التنفيذ (مفاجئة أو أمنية لم تكتمل) تُعرض فوراً وتحجب باقي الواجهة
  const { data: activeSession } = await sb.from('exam_sessions')
    .select('*').eq('status', 'in_progress').order('created_at', { ascending: false }).limit(1).maybeSingle();
  if (activeSession) {
    await renderExamFlow(activeSession);
    return;
  }

  // ٢) بوابة اختبار الوعي الأمني الإلزامي (مغلقة افتراضياً حتى يفعّلها المالك)
  const { data: gateOn } = await sb.rpc('exam_gate_enabled');
  if (gateOn) {
    const { data: passed } = await sb.rpc('has_passed_mandatory_security_exam');
    if (!passed) {
      await renderExamIntro('security_awareness');
      return;
    }
  }

  document.getElementById('tabsBar').classList.remove('hidden');
  await renderTraineeTab('tasks');
}

function renderExamIntro(scope) {
  document.getElementById('tabsBar').classList.add('hidden');
  const main = document.getElementById('mainContent');
  const title = scope === 'security_awareness' ? 'اختبار الوعي الأمني الإلزامي' : 'اختبار';
  main.innerHTML = `
    <div class="panel">
      <h2>${esc(title)}</h2>
      <div class="msg-box msg-warn">يجب اجتياز هذا الاختبار قبل الوصول لمهامك. الأسئلة تُولَّد حياً وتختبر فهمك الفعلي لتعهد السرية — لا تتوقع أسئلة سهلة أو مكررة.</div>
      <button class="full gold" id="startExamBtn" onclick="startExamFlow('${scope}')">بدء الاختبار</button>
      <div id="examIntroMsg"></div>
    </div>
  `;
}

async function startExamFlow(scope) {
  const btn = document.getElementById('startExamBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'جارِ التحضير...'; }
  try {
    const data = await authedFetch('exam-generate-question', { scope });
    await renderExamQuestion(data);
  } catch (err) {
    const msgEl = document.getElementById('examIntroMsg');
    if (msgEl) msgEl.innerHTML = `<div class="msg-box msg-error">${esc(err.message)}</div>`;
    else alert('تعذّر بدء الاختبار: ' + err.message);
    if (btn) { btn.disabled = false; btn.textContent = 'بدء الاختبار'; }
  }
}

async function renderExamFlow(session) {
  document.getElementById('tabsBar').classList.add('hidden');
  const main = document.getElementById('mainContent');
  main.innerHTML = `<div class="loading">جارِ تحميل السؤال...</div>`;
  try {
    const data = await authedFetch('exam-generate-question', { scope: session.scope, exam_session_id: session.id });
    await renderExamQuestion(data);
  } catch (err) {
    main.innerHTML = `<div class="panel"><div class="msg-box msg-error">تعذّر تحميل سؤال الاختبار: ${esc(err.message)}</div></div>`;
  }
}

function renderExamQuestion(data) {
  const main = document.getElementById('mainContent');
  let answerInput = '';
  if (data.question_type === 'mcq' && Array.isArray(data.options)) {
    answerInput = data.options.map((opt, i) => `
      <div class="ack-row"><input type="radio" name="examAnswer" id="examOpt${i}" value="${esc(opt)}"><label style="margin:0" for="examOpt${i}">${esc(opt)}</label></div>
    `).join('');
  } else if (data.question_type === 'true_false') {
    answerInput = `
      <div class="ack-row"><input type="radio" name="examAnswer" id="examOptTrue" value="صح"><label style="margin:0" for="examOptTrue">صح</label></div>
      <div class="ack-row"><input type="radio" name="examAnswer" id="examOptFalse" value="خطأ"><label style="margin:0" for="examOptFalse">خطأ</label></div>
    `;
  } else {
    answerInput = `<textarea id="examShortAnswer" rows="3" placeholder="اكتب إجابتك..."></textarea>`;
  }

  main.innerHTML = `
    <div class="panel">
      <h2>سؤال ${data.question_order} من ${data.questions_total_target}</h2>
      <p style="font-size:13px;color:var(--muted)">مستوى الصعوبة: ${esc(data.difficulty_label || '—')}</p>
      <p style="font-weight:600;font-size:16px">${esc(data.question_text)}</p>
      ${answerInput}
      <div id="examQMsg"></div>
      <button class="full gold" style="margin-top:12px" onclick="submitExamAnswerAction('${data.question_id}', '${data.question_type}')">إرسال الإجابة</button>
    </div>
  `;
}

async function submitExamAnswerAction(questionId, questionType) {
  let answer = '';
  if (questionType === 'short_answer') {
    answer = document.getElementById('examShortAnswer').value.trim();
  } else {
    const checked = document.querySelector('input[name="examAnswer"]:checked');
    answer = checked ? checked.value : '';
  }
  const msgEl = document.getElementById('examQMsg');
  if (!answer) {
    msgEl.innerHTML = `<div class="msg-box msg-error">اختر أو اكتب إجابة قبل الإرسال.</div>`;
    return;
  }
  try {
    const result = await authedFetch('exam-submit-answer', { question_id: questionId, answer });
    const main = document.getElementById('mainContent');
    const resultBox = result.is_correct
      ? `<div class="msg-box" style="background:#eaf6ec;border:1px solid #1e7e34;color:#1e7e34">إجابة صحيحة ✓${result.explanation ? '<br>' + esc(result.explanation) : ''}</div>`
      : `<div class="msg-box msg-error">إجابة غير صحيحة. الإجابة الصحيحة: ${esc(result.correct_answer)}${result.explanation ? '<br>' + esc(result.explanation) : ''}</div>`;

    if (!result.session_complete) {
      main.innerHTML = `<div class="panel">${resultBox}<button class="full gold" style="margin-top:12px" onclick="continueExamFlow()">السؤال التالي</button></div>`;
    } else {
      const passed = result.passed;
      const summary = passed
        ? `<div class="msg-box" style="background:#eaf6ec;border:1px solid #1e7e34;color:#1e7e34">اجتزت الاختبار! النتيجة: ${result.score_percent}% (${result.correct_count}/${result.total_questions})</div>`
        : `<div class="msg-box msg-error">لم تجتز الاختبار هذه المرة. النتيجة: ${result.score_percent}% (${result.correct_count}/${result.total_questions}). سيتم إتاحة محاولة جديدة لاحقاً.</div>`;
      main.innerHTML = `<div class="panel">${resultBox}${summary}<button class="full gold" style="margin-top:12px" onclick="checkExamGatesAndRenderTrainee()">متابعة</button></div>`;
    }
  } catch (err) {
    msgEl.innerHTML = `<div class="msg-box msg-error">${esc(err.message)}</div>`;
  }
}

async function continueExamFlow() {
  await checkExamGatesAndRenderTrainee();
}

    </div>
  `;
  const box = document.getElementById('ndaTextBox');
  const hint = document.getElementById('ndaScrollHint');
  const submitBtn = document.getElementById('ndaSubmitBtn');
  function checkScrolledToEnd() {
    const reachedEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 4;
    if (reachedEnd) {
      ['ack1','ack2','ack3','ack4'].forEach(id => document.getElementById(id).disabled = false);
      submitBtn.disabled = false;
      submitBtn.textContent = 'توقيع وموافقة';
      hint.textContent = 'تم — يمكنك الآن تعبئة الإقرارات والتوقيع.';
      box.removeEventListener('scroll', checkScrolledToEnd);
    }
  }
  box.addEventListener('scroll', checkScrolledToEnd);
  // نص قصير لا يحتاج تمريراً — فعّل مباشرة إن كان المحتوى بأكمله ظاهراً أصلاً
  requestAnimationFrame(checkScrolledToEnd);
}

async function submitNda(versionId) {
  const ack1 = document.getElementById('ack1').checked;
  const ack2 = document.getElementById('ack2').checked;
  const ack3 = document.getElementById('ack3').checked;
  const ack4 = document.getElementById('ack4').checked;
  const fullName = document.getElementById('ndaFullName').value.trim();
  const msgEl = document.getElementById('ndaMsg');

  if (!ack1 || !ack2 || !ack3 || !ack4) {
    msgEl.innerHTML = `<div class="msg-box msg-error">يجب الموافقة على جميع البنود الأربعة.</div>`;
    return;
  }
  if (!fullName) {
    msgEl.innerHTML = `<div class="msg-box msg-error">اكتب اسمك الكامل.</div>`;
    return;
  }

  const { data: signResult, error } = await sb.rpc('sign_nda', {
    p_full_name_entered: fullName,
    p_ack_read_understood: ack1,
    p_ack_confidentiality: ack2,
    p_ack_no_share_publish: ack3,
    p_ack_own_responsibility: ack4,
    p_session_info: { user_agent: navigator.userAgent, signed_from: 'web' },
  });

  if (error) {
    msgEl.innerHTML = `<div class="msg-box msg-error">فشل التوقيع: ${esc(error.message)}</div>`;
    return;
  }

  const signatureId = Array.isArray(signResult) ? signResult[0]?.signature_id : signResult?.signature_id;
  if (signatureId) {
    state.myNdaSignatureId = signatureId;
  }

  await checkExamGatesAndRenderTrainee();
}

// ===== قوائم مرجعية (جامعات/تخصصات/أقسام) مع خيار "إضافة جديد" =====
// تُستخدم في نموذج إضافة الطلب اليدوي وشاشة قبول الطلب. القوائم تبدأ فارغة ويضيف
// إليها الموظفون تدريجياً؛ القيمة النهائية المُرسَلة تبقى نصاً حراً (بدون قيد مفتاح أجنبي)
// حفاظاً على توافقها مع الأعمدة الحالية دون أي تعديل على البيانات القديمة.
async function fetchLookupOptions(tableName) {
  const { data, error } = await sb.from(tableName).select('id, name').order('name');
  if (error) { console.error(`تعذر تحميل قائمة ${tableName}:`, error.message); return []; }
  return data || [];
}

function lookupFieldHtml(fieldId, labelText, options) {
  const opts = options.map(o => `<option value="${esc(o.name)}">${esc(o.name)}</option>`).join('');
  return `
    <label>${labelText}</label>
    <select id="${fieldId}_select" onchange="onLookupSelectChange('${fieldId}')">
      <option value="">— اختر —</option>
      ${opts}
      <option value="__new__">+ إضافة جديد...</option>
    </select>
    <input id="${fieldId}_new" type="text" placeholder="اكتب الاسم الجديد" style="display:none;margin-top:6px">
  `;
}

function onLookupSelectChange(fieldId) {
  const sel = document.getElementById(`${fieldId}_select`);
  const newInput = document.getElementById(`${fieldId}_new`);
  if (!sel || !newInput) return;
  if (sel.value === '__new__') {
    newInput.style.display = '';
    newInput.focus();
  } else {
    newInput.style.display = 'none';
    newInput.value = '';
  }
}

// يُرجع القيمة النصية النهائية (موجودة أو مُضافة حديثاً). عند إضافة قيمة جديدة، يتحقق أولاً
// من عدم وجود تطابق شبه مطابق (case-insensitive) قبل الإدراج لتفادي تكرار قريب الشبه.
async function resolveLookupValue(fieldId, tableName, required) {
  const sel = document.getElementById(`${fieldId}_select`);
  const newInput = document.getElementById(`${fieldId}_new`);
  if (sel.value === '__new__') {
    const value = (newInput.value || '').trim();
    if (!value) {
      if (required) throw new Error('يرجى إدخال القيمة الجديدة.');
      return null;
    }
    const { data: existing } = await sb.from(tableName).select('id, name').ilike('name', value).maybeSingle();
    if (existing) return existing.name;
    const { error: insErr } = await sb.from(tableName).insert({ name: value });
    if (insErr && insErr.code !== '23505') throw new Error(insErr.message);
    return value;
  }
  const value = sel.value;
  if (!value) {
    if (required) throw new Error('هذا الحقل مطلوب.');
    return null;
  }
  return value;
}

}

async function createTempAccountAction(traineeId) {
  const starts = document.getElementById('taStart').value;
  const ends = document.getElementById('taEnd').value;
  const username = document.getElementById('taUsername').value.trim();
  const msgEl = document.getElementById('taMsg');
  if (!starts || !ends) { msgEl.innerHTML = `<div class="msg-box msg-error">التواريخ مطلوبة.</div>`; return; }
  try {
    const payload = { trainee_id: traineeId, starts_at: starts, ends_at: ends };
    if (username) payload.username = username;
    const data = await authedFetch('create-temp-account', payload);
    const credsText = `اسم المستخدم: ${data.username}\nكلمة المرور: ${data.temporary_password}`;
    msgEl.innerHTML = `
      <div class="credential-box">
        <b>تم إنشاء الحساب! سلّم هذه البيانات للمتدرب خارج النظام فوراً — لن تظهر مرة أخرى:</b><br>
        اسم المستخدم: <code>${esc(data.username)}</code><br>
        كلمة المرور: <code>${esc(data.temporary_password)}</code><br>
        <button class="small" style="margin-top:8px" id="copyCredsBtn">نسخ بيانات الدخول</button>
      </div>`;
    document.getElementById('copyCredsBtn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(credsText);
        const b = document.getElementById('copyCredsBtn');
        b.textContent = 'تم النسخ ✓';
        setTimeout(() => { b.textContent = 'نسخ بيانات الدخول'; }, 2000);
      } catch { alert('تعذّر النسخ التلقائي — انسخ النص يدوياً.'); }
    });
    setTimeout(() => viewTraineeDetail(traineeId), 8000);
  } catch (err) {
    msgEl.innerHTML = `<div class="msg-box msg-error">${esc(err.message)}</div>`;
  }
}

function openNewTaskModal(traineeId) {
  openModal(`
    <h3>مهمة جديدة</h3>
    <label>العنوان</label><input id="ntTitle" type="text">
    <label>الوصف (اختياري)</label><textarea id="ntDesc"></textarea>
    <label>الموعد النهائي (اختياري)</label><input id="ntDue" type="date">
    <div id="ntMsg"></div>
    <div class="modal-actions">
      <button class="gold" onclick="createTaskAction('${traineeId}')">إضافة</button>
      <button class="secondary" onclick="closeModal()">إلغاء</button>
    </div>
  `);
}

async function createTaskAction(traineeId) {
  const title = document.getElementById('ntTitle').value.trim();
  const msgEl = document.getElementById('ntMsg');
  if (!title) { msgEl.innerHTML = `<div class="msg-box msg-error">العنوان مطلوب.</div>`; return; }
  const { error } = await sb.rpc('create_task', {
    p_trainee_id: traineeId, p_title: title,
    p_description: document.getElementById('ntDesc').value.trim() || null,
    p_due_date: document.getElementById('ntDue').value || null,
  });
  if (error) { msgEl.innerHTML = `<div class="msg-box msg-error">${esc(error.message)}</div>`; return; }
  closeModal();
  await viewTraineeDetail(traineeId);
}

function openNewEvaluationModal(traineeId) {
  openModal(`
    <h3>تقييم جديد</h3>
    <label>الدرجة (0-100)</label><input id="neScore" type="number" min="0" max="100">
    <label>ملاحظات (اختياري)</label><textarea id="neNotes"></textarea>
    <div id="neMsg"></div>
    <div class="modal-actions">
      <button class="gold" onclick="createEvaluationAction('${traineeId}')">حفظ التقييم</button>
      <button class="secondary" onclick="closeModal()">إلغاء</button>
    </div>
  `);
}

async function createEvaluationAction(traineeId) {
  const score = document.getElementById('neScore').value;
  const msgEl = document.getElementById('neMsg');
  const { error } = await sb.rpc('create_evaluation', {
    p_trainee_id: traineeId, p_score: score === '' ? null : Number(score),
    p_notes: document.getElementById('neNotes').value.trim() || null,
  });
  if (error) { msgEl.innerHTML = `<div class="msg-box msg-error">${esc(error.message)}</div>`; return; }
  closeModal();
  await viewTraineeDetail(traineeId);
}

function openIssueCertModal(traineeId) {
  openModal(`
    <h3>إصدار شهادة</h3>
    <label>نوع الشهادة</label>
    <select id="icType">
      <option value="completion">شهادة إتمام</option>
      <option value="excellence">شهادة تفوق</option>
      <option value="participation">شهادة مشاركة</option>
    </select>
    <div id="icMsg"></div>
    <div class="modal-actions">
      <button class="gold" onclick="issueCertAction('${traineeId}')">إصدار</button>
      <button class="secondary" onclick="closeModal()">إلغاء</button>
    </div>
  `);
}

async function issueCertAction(traineeId) {
  const type = document.getElementById('icType').value;
  const msgEl = document.getElementById('icMsg');
  const { data: certId, error } = await sb.rpc('issue_certificate', { p_trainee_id: traineeId, p_certificate_type: type });
  if (error) { msgEl.innerHTML = `<div class="msg-box msg-error">${esc(error.message)}</div>`; return; }
  try {
    await authedFetch('certificate-pdf', { certificate_id: certId });
  } catch (e) { /* توليد PDF قد يحتاج إعادة محاولة لاحقاً من "تحميل PDF" — لا نفشل الإصدار بسببه */ }
  closeModal();
  await viewTraineeDetail(traineeId);
}

async function renderTracksTab(main) {
  const { data: tracks } = await sb.from('training_tracks').select('*').order('created_at', { ascending: false });
  const rows = (tracks || []).map(t => `
    <tr>
      <td>${esc(t.name)}</td>
      <td>${esc(t.description || '—')}</td>
      <td>${t.is_active ? badge('active') : badge('archived')}</td>
      <td>${state.isAdminOrManager ? `<button class="small secondary" onclick="openTrackExamNotesModal('${t.id}', '${esc(t.name).replace(/'/g, "\\'")}')">محتوى الاختبار</button>` : '—'}</td>
    </tr>
  `).join('') || `<tr><td class="empty-row" colspan="4">لا توجد مسارات بعد</td></tr>`;

  main.innerHTML = `
    <div class="panel">
      <h2>المسارات التدريبية</h2>
      ${state.isAdminOrManager ? `
        <div class="actions-row" style="margin-bottom:14px">
          <input id="newTrackName" type="text" placeholder="اسم مسار جديد" style="max-width:260px;margin-bottom:0">
          <button onclick="addTrackAction()">+ إضافة</button>
        </div>
        <div id="trackMsg"></div>
      ` : ''}
      <table><thead><tr><th>الاسم</th><th>الوصف</th><th>الحالة</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    </div>
  `;
}

async function addTrackAction() {
  const name = document.getElementById('newTrackName').value.trim();
  const msgEl = document.getElementById('trackMsg');
  if (!name) { msgEl.innerHTML = `<div class="msg-box msg-error">اكتب اسم المسار.</div>`; return; }
  const { error } = await sb.from('training_tracks').insert({ name });
  if (error) { msgEl.innerHTML = `<div class="msg-box msg-error">${esc(error.message)}</div>`; return; }
  await renderStaffTab('tracks');
}

async function openTrackExamNotesModal(trackId, trackName) {
  const { data: track } = await sb.from('training_tracks').select('exam_content_notes').eq('id', trackId).single();
  openModal(`
    <h3>محتوى اختبار مسار: ${esc(trackName)}</h3>
    <p style="font-size:13px;color:var(--muted)">اكتب نقاطاً مختصرة عن محتوى هذا المسار المهني — تُستخدم لتوجيه توليد أسئلة الاختبار التكيفي الخاصة بهذا المسار. اتركها فارغة لاعتماد اسم المسار فقط.</p>
    <textarea id="trackNotesInput" rows="6" placeholder="مثال: أساسيات SEO، إدارة الحملات الإعلانية على منصات التواصل، تحليل بيانات الأداء...">${esc(track?.exam_content_notes || '')}</textarea>
    <div id="trackNotesMsg"></div>
    <div class="modal-actions">
      <button class="gold" onclick="saveTrackExamNotes('${trackId}')">حفظ</button>
      <button class="secondary" onclick="closeModal()">إلغاء</button>
    </div>
  `);
}

async function saveTrackExamNotes(trackId) {
  const notes = document.getElementById('trackNotesInput').value.trim();
  const msgEl = document.getElementById('trackNotesMsg');
  const { error } = await sb.from('training_tracks').update({ exam_content_notes: notes || null }).eq('id', trackId);
  if (error) { msgEl.innerHTML = `<div class="msg-box msg-error">${esc(error.message)}</div>`; return; }
  closeModal();
}

// ============================================================================
// إعدادات نظام الاختبارات التكيفي (للمدير العام / مدير التدريب)
// ============================================================================

async function renderExamsSettingsTab(main) {
  const { data: cfg } = await sb.from('exam_system_config').select('*').maybeSingle();
  if (!cfg) {
    main.innerHTML = `<div class="panel"><div class="msg-box msg-error">تعذّر تحميل إعدادات نظام الاختبارات.</div></div>`;
    return;
  }
  main.innerHTML = `
    <div class="panel">
      <h2>نظام الاختبارات التكيفي بالذكاء الاصطناعي</h2>
      <div class="msg-box msg-warn">
        هذا النظام يولّد أسئلة حية عبر نموذج ذكاء اصطناعي خارجي. لن يعمل حتى تُضيف السرّين
        <code>EXAM_LLM_API_KEY</code> و<code>EXAM_LLM_MODEL</code> كأسرار Edge Function في لوحة تحكم Supabase
        (Project Settings → Edge Functions → Secrets) — لا تُدخل المفتاح هنا ولا في الدردشة أبداً.
        اختبر التدفق فعلياً بحساب متدرب تجريبي قبل التفعيل على متدربين حقيقيين.
      </div>

      <h3>بوابة اختبار الوعي الأمني الإلزامي قبل أول مهمة</h3>
      <p style="font-size:13px;color:var(--muted)">عند التفعيل، لن يصل أي متدرب لمهامه أو تقييماته حتى يجتاز اختبار الوعي الأمني. الحالة الحالية: ${cfg.security_gate_enabled ? badge('active') : '<span class="badge">معطّلة</span>'}</p>
      ${state.isAdmin ? `
        <button class="${cfg.security_gate_enabled ? 'secondary' : 'gold'}" onclick="toggleExamGate(${!cfg.security_gate_enabled})">${cfg.security_gate_enabled ? 'تعطيل البوابة' : 'تفعيل البوابة'}</button>
      ` : `<p style="font-size:12px;color:var(--muted)">هذا التبديل متاح للمدير العام فقط.</p>`}

      <h3 style="margin-top:20px">الاختبارات الدورية المفاجئة</h3>
      <p style="font-size:13px;color:var(--muted)">عند التفعيل، يُنشئ النظام تلقائياً اختبارات مفاجئة عشوائية للمتدربين النشطين (احتمالية ${Math.round((cfg.periodic_surprise_daily_probability || 0) * 100)}% يومياً لكل متدرب مؤهّل). الحالة الحالية: ${cfg.periodic_surprise_enabled ? badge('active') : '<span class="badge">معطّلة</span>'}</p>
      ${state.isAdminOrManager ? `
        <button class="${cfg.periodic_surprise_enabled ? 'secondary' : 'gold'}" onclick="togglePeriodicSurprise(${!cfg.periodic_surprise_enabled})">${cfg.periodic_surprise_enabled ? 'تعطيل الاختبارات المفاجئة' : 'تفعيل الاختبارات المفاجئة'}</button>
      ` : ''}
      <div id="examSettingsMsg" style="margin-top:12px"></div>
    </div>
  `;
}

async function toggleExamGate(enable) {
  const msgEl = document.getElementById('examSettingsMsg');
  const { error } = await sb.rpc('set_exam_gate_enabled', { p_enabled: enable });
  if (error) { msgEl.innerHTML = `<div class="msg-box msg-error">${esc(error.message)}</div>`; return; }
  await renderStaffTab('exams');
}

async function togglePeriodicSurprise(enable) {
  const msgEl = document.getElementById('examSettingsMsg');
  const { error } = await sb.rpc('set_periodic_surprise_enabled', { p_enabled: enable });
  if (error) { msgEl.innerHTML = `<div class="msg-box msg-error">${esc(error.message)}</div>`; return; }
  await renderStaffTab('exams');
}

init();
</script>
